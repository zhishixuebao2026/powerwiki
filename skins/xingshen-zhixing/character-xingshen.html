},Ot={overall:"**综合量级：⊙外·三 起〔下〕（掌控式）。** 论外三线，即从连续统（2^ℵ₀）起，掌控式，只能确认至少到这一档。依据分两步：",overallSteps:['**这个宇宙写出了连续统的结构。** 星神造出的宇宙是 "无限且不可数的解"，书中交代了生成方式，即对不可判定的公理逐一取舍。泰拉宇宙被写成 "基于笛卡尔积定义下的自然数的幂集"。见第一节。','**星神的行动作用于这个宇宙的整体。** 他们 "撤回了宇宙中所有的以太"，又集体离开以太宇宙。他们造出的大以太环流 "环绕着无限大宇宙，贯穿所有时空与可能性"。见第二节。'],floor:'**保底量级：⊙外·三〔下〕（创造式）。** 依据只有创造那一段，不依赖对整体行动的解读："星神由最初至源头，构筑出了有与无这最基础的逻辑，继而由这逻辑构筑出了无法尽数的宇宙，得到了无限且不可数的解。"',positionLabel:"**位格**：",position:['**存在规模：外·三〔下〕。** 星神站在 "‘逻辑宇宙之外’"，"包裹着万有的存在"。叙述说 "星神就是以太，星神就是以太时空本身。"，并称他们 "实在性比宇宙本身还要高"。','**层级轴（结构标注）。** 本系列中星神是合道。成为星神后的伊恩被称为 "这个封印多元中的合道"，而复活无限平行时空中的所有人 "需要的是超越合道的伟力，其名为‘洪流’"。以太宇宙只是冰凝虚空中的一个宇宙。衡天量级与苏昼同为外·三，两者的差距体现在层级轴上，见第四节。','**计算层级：0′〔下〕。** 0′ 是第一次图灵跃迁，即在有限时间里完成可数无限步并得到结果。依据是以太能 "直接用【尽远道】抵达‘无限遥远的未来’"，跳过全部过程，把整个宇宙的最终结局变成现实。'],traitsLabel:"**特性**：",traits:["先构筑「有与无」的基础逻辑，再由逻辑生出宇宙；",'创造各种「异宇宙」，可以改动物理律，直到 "彻底独立于母宇宙，且拥有完全异常数学律的异宇宙"；',"创造「摇篮」，即口袋宇宙；","大以太环流：贯穿所有平行时空的超结构，是以太、真铭文与各种超凡力量的源头；","尽远道：跳过过程，直达结局；",'感知和思维直接改变宇宙时空："祂们的目光就是触碰，祂们的感知能令宇宙坍塌，祂们的思维能让宇宙时空改变，超光速地改变。"'],claimsLabel:"**设定宣称**（不参与定级）：",claims:['数学背后有 "超越人类逻辑乃至于一切逻辑" 的「数学理念宇宙」；','星神是 "身居逻辑之外的创始者，第一推动力"；','大以太环流 "超越了宇宙真理，凌驾于大道与苍天之上"；','泰拉宇宙 "无法用四则运算自下而上到达"。可数集做加法和乘法确实得不到连续统，这已包含在外·三里，不另外加档；',"苏斯林树：见第一节。"],credibility:'**可信度**：中。关键段落都是叙述者的说明文字：一处在千星之子「黯」的梦境里，一处在伊恩借天父的指引观看终焉的场景里。两处措辞不同，内容一致，也与后记、番外对得上。弱点有两个。其一，生成方式写得最完整的「树」那句，说的是千星之子的繁衍，书中注明那是 "千星之兽真是模仿了星神孵化宇宙的形态"。其二，较早章节里另有一种起源说法，见第六节。'},z0={head:["维度","记录"],rows:[["控（整体掌控）","外·三 起〔下〕（掌控式）：撤回整个宇宙的以太；大以太环流环绕整个宇宙；摇篮之河让所有支流环绕星神的力量旋转。见第二节"],["破（破坏）",'没有毁灭宇宙整体的战绩。"感知能令宇宙坍塌" 是一般性的说明，没有具体事件'],["域（影响）",'大以太环流覆盖以太宇宙的全部平行时空，而且 "在这个宇宙中，大以太环流都存在且只存在一个。"'],["御（防御）",'有限。单个星神会死，天父就是一位死去的星神。整个族群面对终焉 "节节败退"，见第三节'],["速（速度）",'尽远道能跳过无限远的距离。宇宙 "需要‘无限的时间才能抵达’" 的中央，伊恩成为星神后一瞬间就到了'],["性（特性）","见上"]]},Oe={title:"以太宇宙的结构",paras:['**宇宙是数学的「解」。** 叙述先讲数学的不完备："一个数学理论集合中，必定拥有某种不可判定的命题"。在这个不可穷尽的理论序列里，"只要随便采取一部分，便可以产生某种特定种类的，对真理的‘解’。"。接着以连续统假设为例："实数是不可数的，它比整数的集要大。"；在集合论里这个问题无法判定，必须附加假设，而有了这些假设，"就可以得到许多不同版本的‘数学’。"。随后一句点题："宇宙就是这样的‘解’。"','**星神造出了全部的解。** "星神由最初至源头，构筑出了有与无这最基础的逻辑，继而由这逻辑构筑出了无法尽数的宇宙，得到了无限且不可数的解。" 下一句说明这些解是实在的宇宙："也就是真实无限的宇宙，以及它们各自独立的无限平行时空。"，并且 "而这些宇宙中，全部都拥有生命。"','**泰拉宇宙本身是幂集。** 星神与终焉的战场写作 "在泰拉这基于笛卡尔积定义下的自然数的幂集，无法用四则运算自下而上到达的倒生卡巴拉"。'],whyLead:"**为什么认外·三。** 门槛是要写出一个可数集合的全部子集，并且每个子集各对应一个完整结构，全部同时存在。只出现「不可数」三个字是不够的。这里满足门槛的理由有三：",why:["「不可数」用的是数学含义。同一段在两行之前刚用它说明实数集比整数集大，指的不是「数不清」。",'生成方式写清楚了。不可判定的命题有可数无限个，每个命题取真或取假，每一种完整的取舍得到一个版本的数学，也就是一个宇宙。这样的取舍一共有 2^ℵ₀ 种。这和「皮亚诺算术的完全扩张一共有 2^ℵ₀ 个」是同一个道理。书中又说这些解 "无限且不可数"，而且是 "真实无限的宇宙"，数目与机制对得上。',"泰拉宇宙被直接写成自然数的幂集，与上面的结构相互印证。"],notHigherLead:"**为什么不到更高。**",notHigher:['**苏斯林树。** 星神与终焉在 "这每一个链（枝）和反链都至多可数的苏斯林树上进行着完全信息的无穷博弈。"。苏斯林树高为第一个不可数序数 ω₁，每一层可数，一共 ℵ₁ 个节点，不超过连续统。它的存在在集合论里不可判定，但不可判定不等于更大。',"**「数学理念宇宙」和「逻辑之外」。** 它们只是名号，没有写出比连续统更多的东西如何构成。","**「无法用四则运算自下而上到达」。** 说的是连续统，已经计入。"]},jf={title:"对宇宙整体的行动",paras:['**改造整个宇宙。** 在伊恩从「回声」处听到的历史里，星神用超时空网道和以太遍布整个宇宙，"改造整个无限宇宙"。','**大以太环流。** 这是星神的至高造物。叙述写它从无穷分裂的命运之河中收束而成："环绕着无限大宇宙，贯穿所有时空与可能性，与宇宙一体，甚至比宇宙更加宏大的‘环’。"','**撤回以太并离开。** 星神把所有文明保存在摇篮里，"撤回了宇宙中所有的以太"，然后 "集体离开了【以太宇宙】，朝着宇宙之外的虚空而去"。这样一来，"作为实在性比宇宙本身还要高的星神" 能把最危险的终焉一起引走。','**摇篮之河。** 无数摇篮由宇宙弦连成跨越整个宇宙的环，"让整个宇宙都变成了可以轻松逆转时空的哥德尔模型宇宙"。并且 "宇宙分裂为了无数条支流，而每一条支流又能衍生出无数条支流，这无穷无尽的衍生本身也无穷无尽，而星神的力量便是这一切的轴心"。'],conclusion:"**结论。** 这几项都作用于以太宇宙的整体，而第一节说明这个整体至少有连续统的结构。所以记 外·三 起〔下〕（掌控式）。书中「宇宙」一词有时指星神的全部造物，有时指泰拉宇宙。不论取哪一种，泰拉宇宙本身已经是幂集，结论不变。"},qm={title:"与终焉的战争",paras:['**终焉的来历。** 终焉本来只是一种可能性。以太的力量 "直接用【尽远道】抵达‘无限遥远的未来’"，把整个宇宙的最终结局变成了现实。伊恩的结论是 "真的是星神自己把以太送进‘终焉’里的"，又说 "终焉，就是宇宙本身……"。','**胜负。** 在苏斯林树上的博弈中，终焉胜利时泰拉宇宙只剩唯一的结局；反之，"如果星神取得胜利，那么宇宙的分叉数（可能性）就是无穷的。"。实际战况是 "面对无穷种不同且无比强大的终焉，星神必然节节败退"，星神最终带着终焉离开了以太宇宙。',"**对定级的影响。** 双方没有正面分出胜负，所以不用终焉来抬高星神的破坏。星神处于下风也不压低他们的创造与掌控，这两项都另有依据。"]},Dt={title:"在同一系列中的位置",lead:'番外第 1096 章章末说明："高天的确和怪物被杀就会死是同一个世界观的"。',posLead:"**以太宇宙在多元宇宙里的位置。** 伊恩成为星神后到达宇宙中央的空洞，看见了冰凝虚空：",pos:['虚空里是 "一个又一个完全不同，基于不同基盘而诞生的宇宙"；','"伟大的封印笼罩所有的一切"。'],posTail:"以太宇宙是这些宇宙中的一个，也就是封印多元宇宙中的一个「基盘」。",tierLead:"**星神的层级。** 书中两处都把星神放在合道一级：",tier:['叙述说 "那么星神就是已然合道，已经掌握真理的种族。"，大以太环流也被称作 "合道武装"；','番外中，宇宙尽头酒馆里的合道们称伊恩为 "这个封印多元中的合道"。'],tierTail:'《怪物被杀就会死》对合道的交代
