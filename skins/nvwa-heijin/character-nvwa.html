件事是 ⊙星△（范围对照）'},{label:"保底量级",emphasis:"secondary",value:"补天立极〔实〕，不落档——去掉的是「按范围对照到行星尺度」这一步"},{label:"位格",emphasis:"muted",value:"—（各版本没有关于自身体量或居所大小的记述；「人头蛇身」「七十化」记入特性）"},{label:"可信度",value:"中偏低。综合量级取的是一个代表版本，不是各版本的合并。取《列子》，是因为它是能落到档位的最高一版：《汤问》全篇由夏革答商汤问来交代天地的道理，夏革就是这一篇的讲述者，他的话按设定采信。有争议的有两步：一是「不知几亿万里」只给了数量级，按最小读法取下限；二是拿范围去对照档位，保底已经去掉"},{label:"破（破坏力）",value:"断鳌足、杀黑龙〔实〕，能量〔缺〕（《淮南子》）"},{label:"能量输出",value:"炼石总热量约 2.5×10¹⁹～4.1×10¹⁹ J，超爆城级，属长时间累计（《红楼梦》）"},{label:"域（影响范围）",value:"止住淫水：范围为「四海之内」，约 1.26 亿平方公里〔实〕（《淮南子》及高诱注）；招妖幡召来天下群妖（《封神演义》）"},{label:"性（特性）",value:"人头蛇身；一日七十化；化万物；抟黄土造人；肠化为十神。各见所属版本"},{label:"作品内位次",value:'《淮南子》里事成之后"朝帝于灵门"，高诱注称她辅佐伏羲；《封神演义》里要去朝贺伏羲、炎帝、轩辕三圣，行事受气运约束'}],n0="整体掌控、防御、速度、计算层级没有可用的表现，未列出。",u0=[{version:"《楚辞·天问》及王逸注",era:"战国；注为东汉",deeds:"只问她的身体是谁造的；注称人头蛇身、一日七十化",tier:"未定级",tierTone:"ungraded"},{version:"《淮南子》",era:"西汉",deeds:"补苍天、断鳌足立四极、杀黑龙、积芦灰止淫水",tier:"⊙星△（范围对照）；四极相距约 9.7 万公里；能量〔缺〕",tierTone:"planetary"},{version:"《风俗通义》佚文",era:"东汉",deeds:"抟黄土造人，忙不过来，改用绳子蘸泥甩出人来",tier:"未定级",tierTone:"ungraded"},{version:"《说文解字》《山海经》郭璞注",era:"东汉；东晋",deeds:"化万物；肠化为十位神",tier:"未定级",tierTone:"ungraded"},{version:"《列子·汤问》",era:"旧题战国，今本晚出",deeds:"夏革讲述：补天之阙、断鳌足立四极",tier:"⊙弱化弱恒星系（范围对照）〔下〕；归墟在渤海之东至少 10⁹ 里，约 2.8 个天文单位；不取这一句时为 ⊙星☆〔下〕；世界向东至少四十万里，约 16.6 万公里；能量〔缺〕",tierTone:"stellar"},{version:"《帝王世纪》《补三皇本纪》",era:"西晋；唐",deeds:"上古女皇；共工撞坏天柱之后补天、立极、止水",tier:"补天立极〔实〕；范围未写，不落档",tierTone:"unslotted"},{version:"《独异志》",era:"唐",deeds:"宇宙初开时与兄长在昆仑山结为夫妻，繁衍人类",tier:"未定级",tierTone:"ungraded"},{version:"《封神演义》",era:"明",deeds:"以招妖幡召集群妖、派三妖祸乱殷商；借出法宝助人擒妖",tier:"未定级",tierTone:"ungraded"},{version:"《红楼梦》",era:"清",deeds:"炼成三万六千五百零一块巨石，用其中三万六千五百块补天",tier:"⊙城☆（累计 · 需时）；炼石约 2.5×10¹⁹～4.1×10¹⁹ J",tierTone:"city"},{version:"各地口传 3 则",era:"近现代采录",deeds:"拼天、造地、抓出山海、造人；或作玉帝之女下凡成婚",tier:"多数范围未写",tierTone:"unslotted"}],i0=[{label:"最高的一版",text:"《列子·汤问》。同一部书里，归墟在渤海之东「不知几亿万里」，按最小读法约 2.8 个天文单位；尺寸只有下限。量级栏的综合量级取这一版。"},{label:"由正文直叙、事迹最完整的一版",text:"《淮南子》，⊙星△（范围对照）。"},{label:"唯一能算出能量的一版",text:"《红楼梦》。石头的块数和尺寸都写明了，炼石的总热量在超爆城级。"},{label:"最低的一组",text:"只记身份、形貌和造人的几种，综合量级为未定级。"},{label:"区间",text:"未定级 — 城☆（累计）— 星△（范围对照）— 星☆（范围对照，下限）。"}],c0=[{symbol:"⊙",meaning:"综合量级标记",tone:"gold"},{symbol:"未定级",meaning:"破坏、整体掌控两维都没有过关的证据，不是高于一切档位的位置",tone:"neutral"},{symbol:"星△",meaning:"强爆行星级：打爆两倍地球质量的行星，上至木星下限（4.48×10³²～2.06×10³⁶ J）。本条目只借用它的尺度段",tone:"lapis"},{symbol:"星☆",meaning:"超爆行星级：打爆木星及以上（2.06×10³⁶ J 起）。本条目只借用它的尺度段",tone:"lapis"},{symbol:"弱化弱恒星系",meaning:"超过一个天文单位、不到恒星系级下限（直径 40 天文单位）的覆盖范围，须写出焦耳数。直径 2.8 天文单位约 1.8×10⁴⁷ J。本条目只借用它的尺度段",tone:"crimson"},{symbol:"城☆",meaning:"超爆城级：4.184×10¹⁸ J 起，至弱爆国级 6.276×10¹⁹ J 之下",tone:"jade"},{symbol:"范围对照",meaning:"档位按被作用对象的尺寸对照得出，没有能量依据。地球直径 1.27 万公里，木星直径 14.0 万公里；超过一颗恒星的直径时，按覆盖直径对照恒星级以上各档；对象在两者之间对到星△，超过木星直径对到星☆",tone:"gold"},{symbol:"累计 · 需时",meaning:"能量是许多次、长时间加起来的总量，不是一次输出，记为弱化",tone:"jade"},{symbol:"位格",meaning:"存在规模、计算层级、层级轴中证据过关的记录，与综合量级并列，互不推出",tone:"neutral"},{symbol:"〔实〕",meaning:"已确认：文本直接叙述了该表现",tone:"jade"},{symbol:"〔下〕",meaning:"下限：只能确认至少如此",tone:"gold"},{symbol:"〔缺〕",meaning:"缺：文本没有可用的数据",tone:"crimson"}],zs={lead:"女娲的记载比盘古早得多，也杂得多，大致有四条线：",lines:[{title:"造物的神。",body:'战国的《天问》只问了一句她的身体是谁造的；东汉的《说文解字》说她是"化万物者"，《风俗通义》记下了抟土造人的俗说。'},{title:"补天的神。",body:"西汉《淮南子》写了完整的一段：补苍天、立四极、杀黑龙、止淫水。这是各版本里作为最多、最具体的一种。"},{title:"上古的帝王。",body:"晋唐的史书把她写成继伏羲而立的女皇，补天成了她在位末年的一件事。"},{title:"小说里的神女。",body:"《封神演义》里她坐镇行宫、用法宝办事；《红楼梦》开篇借她炼石补天引出那块顽石。"}],afterLines:["东汉的王充在《论衡》里专门质疑过补天立极的说法，他的推理和今天讨论量级时的思路很接近，本条目单列一节。","各版本的结果落在三类：只有身份、形貌或造人的，记未定级；补天立极的，按她重整的天地有多大对照范围；《红楼梦》写明了石头的数量和尺寸，可以直接算炼石的热量。"]},qn={versionBoundaries:["一部文献算一个版本。《淮南子》各篇同属一书，补天的事迹在《览冥训》，天地的尺寸在《墜形训》《天文训》，合在一起用。","《论衡》转述补天立极是为了反驳，不算一个版本，单列一节。","类书、史注整段转录前代文字而没有新增内容的，不另算版本。","每个版本只用它自己写明的世界和其他角色。"],citationsNote:"古籍引文据原文转为简体，标点为整理所加。口传各则没有见到原书，只作转述，不加引号。",howToRecord:[{title:"它是重整天地，不是接管天地。",body:"整体掌控要求同时支配范围内的全部物质与范围本身。女娲做的是几件具体的事：炼石、断足、杀龙、堆灰，每件各记各的，不合成掌控。"},{title:"能量没有依据。",body:"补上去的石头有多少、鳌足有多粗，《淮南子》都没有写，没有依据的数值不凭空设定，能量记〔缺〕。"},{title:"只能对照范围。",body:"四极是天地四方的尽头，重立四极的范围就是整个天地。文献写明天地尺寸的，换算成公里，与现实天体的尺度对照；没写的记「范围未写」，不落档。"}],ancientCosmosNote:"这些文献里的天地是有高度、有边界的结构。能量轴是按现代宇宙观的世界设计的，「宇宙尺寸未写按标准宇宙」的默认值也只针对现代意义的完整宇宙，这里都不套用。天地的大小以文献自己写的里数为准。",conversions:[{item:"汉里",value:"约 0.416 公里",note:"1 里 1800 尺，汉尺约 23.1 厘米"},{item:"清代营造尺",value:"约 32 厘米",note:"一丈 3.2 米"},{item:"亿",value:"十万",note:'古代的亿有十万和万万两种用法。《周髀算经》古注引八极里数之后写明"夫言亿者，十万曰亿也"，本条目对这组天地里数按十万读'},{item:"岩石加热至熔融",value:"约 3～5 千焦每立方厘米",note:"熔化潜热：花岗岩 220～300 千焦每千克，辉长岩约 400～500 千焦每千克；液相线温度分别约 900℃、1200℃；固态比热取约 1 千焦每千克每开"}]},w={tianwen:{heading:"（一）《楚辞·天问》与王逸注",intro:"《天问》是现存最早提到女娲的文献，只有一句：",quote1:'"女娲有体，孰制匠之？"',noteIntro:"东汉王逸注：",quote2:'"传言女娲人头蛇身，一日七十化"',deedsLabel:"女娲做了什么",deedsText:"正文没有写她做什么，只是问造出万物的她，身体又是谁造的。注文是「传言」，记下形貌和变化。",verdict:[{label:"综合量级",value:"未定级",emphasis:"primary"},{label:"保底量级",value:"—",emphasis:"muted"},{label:"位格",value:"—",emphasis:"muted"},{label:"性（特性）",value:"人头蛇身；一日七十化（注文所记的传言）"}]},huainanzi:{heading:"（二）《淮南子》",intro:"西汉淮南王刘安及其门客所撰。《览冥训》：",quote:'"往古之时，四极废，九州裂，天不兼覆，地不周载，火爁炎而不灭，水浩洋而不息，猛兽食颛民，鸷鸟攫老弱，于是女娲炼五色石以补苍天，断鳌足以立四极。杀黑龙以济冀州，积芦灰以止淫水。苍天补，四极正，淫水涸，冀州平，狡虫死，颛民生。"',gaoYouIntro:"东汉高诱注有三处与定级有关：",gaoYouNotes:['"女娲阴帝，佐虙戏治者也"——她是辅佐伏羲的。','"鳌，大龟。天废顿，以鳌足柱之"——天塌下来，用鳌的脚当柱子撑住。','"冀，九州中，谓今四海之内"——冀州在这里指四海之内。'],afterGaoYou:'同篇后文说她"考其功烈，上际九天，下契黄垆"，又说她事成之后"登九天，朝帝于灵门"。',deedsHeading:"女娲做了什么",deedsList:[{title:"补苍天",body:'炼五色石，把天补全。原文只说"天不兼覆"，缺口多大没有写。'},{title:"断鳌足以立四极",body:"砍下巨龟的脚，立在四方的尽头撑住天。"},{title:"杀黑龙",body:"高诱注说黑龙是水精。龙的大小没有写。"},{title:"积芦灰以止淫水",body:"堆芦苇灰止住洪水。"}],sizeHeading:"天地的大小",sizeIntro:"同书另外两篇给了尺寸。",sizeSources:['《墜形训》："阖四海之内，东西二万八千里，南北二万六千里"；又"禹乃使太章步自东极，至于西极，二亿三万三千五百里七十五步"。','《天文训》末尾用立表测影的办法算天高："则置从此南至日下里数，因而五之，为十万里，则天高也"。'],conversionLabel:"换算：",scaleRows:[{item:"东极到西极",li:"233,500 里",km:"约 9.7 万",comparison:"地球直径的 7.6 倍，木星直径的 0.7 倍"},{item:"天高",li:"100,000 里",km:"约 4.2 万",comparison:"地球直径的 3.3 倍"},{item:"四海之内",li:"28,000 里 × 26,000 里",km:"约 1.16 万 × 1.08 万，面积约 1.26 亿平方公里",comparison:"约为地球表面的四分之一"}],rangeLabel:"范围",rangeText:"四极立在天地四方的尽头，重立四极、补全苍天，范围就是整个天地，东西约 9.7 万公里，落在地球直径与木星直径之间，对到星△。止住的洪水按高诱注是「四海之内」，约 1.26 亿平方公里。",turtleLegLabel:"鳌足有多长",turtleLegText:"鳌足是用来撑天的，天高十万里，足长应与之相当，约 4.2 万公里。这一步是由用途推出来的，原文没有直接写，只作参考，不进综合量级；它同样落在星△的尺度段。",rankLabel:"作品内位次",rankText:"高诱注称她辅佐伏羲；正文写她事成之后登九天去朝见「帝」，上面还有更高的神。",verdict:[{label:"综合量级",value:"⊙星△（范围对照）——补苍天、立四极〔实〕；范围为整个天地，东极到西极约 9.7 万公里；能量〔缺〕",emphasis:"primary"},{label:"保底量级",value:"补天立极〔实〕，不落档——去掉的是「按范围对照到行星尺度」这一步",emphasis:"secondary"},{label:"位格",value:"—",emphasis:"muted"},{label:"破（破坏力）",value:"断鳌足〔实〕：对象是脚能撑天的巨龟，足长约 4.2 万公里（由用途推出），能量〔缺〕；杀黑龙〔实〕，大小未写"},{label:"域（影响范围）",value:"止住淫水：四海之内，约 1.26 亿平方公里〔实〕"},{label:"性（特性）",value:'炼石补天；《说林训》另记"黄帝生阴阳，上骈生耳目，桑林生臂手，此女娲所以七十化也"，造人时有别的神相助'}]},fengsu:{heading:"（三）《风俗通义》佚文",intro:"东汉应劭撰，这一条原书已佚，见《太平御览》卷七十八所引：",quote:'"俗说天地开辟，未有人民，女娲抟黄土作人，剧务，力不暇供"',afterQuote:'后文说她于是把绳子放进泥里，举起来甩出的泥点也成了人，并以"故富贵者黄土人也，贫贱凡庸者縆人也"作结。',deedsLabel:"女娲做了什么",deedsText:'用黄土一个个捏出人来。原文明说这件事"剧务，力不暇供"，活太重，力气跟不上，才改用绳子蘸泥。',recordLabel:"怎么记",recordText:'造人是创造生命，记入特性；没有规模可言，不进破坏或掌控。"力不暇供"是原文自己写下的限度：这一版的女娲造人要亲手一个个做，而且会忙不过来。开头的"俗说"表明这是当时的民间说法。',verdict:[{label:"综合量级",value:"未定级",emphasis:"primary"},{label:"保底量级",value:"—",emphasis:"muted"},{label:"位格",value:"—",emphasis:"muted"},{label:"性（特性）",value:"抟黄土造人；手工逐个制作，力有不逮"}]},fragments:{heading:"（四）零散记载",rows:[{source:"东汉许慎《说文解字》",quote:'"古之神圣女，化万物者也"',note:"特性：化育万物"},{source:"《山海经·大荒西经》",quote:'"有神十人，名曰女娲之肠，化为神，处栗广之野"',note:"特性：肠化为十位神"},{source:"东晋郭璞注《山海经》",quote:'"女娲，古神女而帝者，人面蛇身，一日中七十变"',note:"特性：形貌与变化"},{source:"《论衡·顺鼓》所记汉代礼俗",quote:'"雨不霁，祭女娲，于礼何见？"',note:"久雨不停时祭女娲求晴，是汉代的做法；王充对此提出疑问"}],outro:"这几条只有身份、形貌和职能，综合量级都是未定级。"}},Fl={heading:"三、东汉人的质疑：《论衡》",intro:'王充在《论衡·谈天》里先转述了儒书的说法：共工争为天子不胜，怒触不周山，天柱折、地维绝，女娲炼石补天、断鳌足立四极。随后逐条反驳，结论是"以天道人事论之，殆虚言也"。',reasoningLead:"他的几条推理：",reasonings:[{title:"鳌的体型",body:'"且鳌足可以柱天，体必长大，不容于天地，女娲虽圣，何能杀之？"——脚能撑天，身体必然大得天地都装不下。'},{title:"鳌的防御",body:'"足可以柱天，则皮革如铁石，刀剑矛戟不能刺之，强弩利矢不能胜射也"——能撑天的脚，皮肉必然硬如铁石。'},{title:"女娲的身高",body:'"女娲，人也，人虽长，无及天者"——人再高也够不着天，她怎么上去补？'},{title:"他给出的解释",body:'"天地始分，形体尚小，相去近也"——也许天地刚分开时还小，天离地很近，所以共工撞得坏、女娲补得着。'}],useLead:"这一节的用处：",uses:["由「鳌足撑天」推出「鳌体型巨大、皮肉坚硬」，是东汉人自己就做过的推理，本条目的足长估算与之同理。","王充的身份是批评者，他认为这些事是虚言。他的话不改变《淮南子》里写了什么，只说明这个传说在东汉已经被人拿尺寸去核对过。","他提出的「当时天很低」是一种解释，《淮南子》本身没有这样写，不采用。"],outro:"《论衡》里共工在前、女娲在后；《列子》相反，女娲补天在前、共工触山在后。两种顺序各归各的版本。"},Oe={heading:"四、《列子·汤问》",intro:"旧题战国列御寇撰，今本一般认为成书较晚。补天的话出自书中人物夏革之口，是他回答商汤提问时说的：",quote:'"然则天地亦物也。物有不足，故昔者女娲氏练五色石以补其阙，断鳌之足以立四极。其后共工氏与颛顼争为帝，怒而触不周之山，折天柱，绝地维"',deedsLabel:"女娲做了什么",deedsText:"补天之阙，断鳌足立四极。这里的天地是本来就「有不足」，女娲去补；共工触山是此后的事。",worldLabel:"这一版的世界",worldIntro:"同一篇里夏革还讲了别的，可以看出这部书里的天地有多大。",worldBullets:['僬侥国在"从中州以东四十万里"，约 16.6 万公里。四极在天地的尽头，至少在这之外。','海上有五座仙山，"其山高下周旋三万里，其顶平处九千里"，约 1.25 万公里和 3,700 公里。','天帝"乃命禺强使巨鳌十五举首而戴之"，用巨鳌的头顶住这些山。','龙伯国的巨人"一钓而连六鳌"，一竿钓走六只。','夏革自己也说不清天地之外："朕亦焉知天地之表不有大天地者乎"。'],otherCharsLabel:"同版本的其他角色",otherCharsText:"这部书里的鳌能用头顶起周长三万里的山，女娲断的是这种鳌的脚；而龙伯国的巨人一次钓走六只，天帝又能把龙伯国削小。鳌在这一版里并不是最强的东西。",guixuLabel:"归墟",guixuText1:'同一段里夏革又说"渤海之东不知几亿万里，有大壑焉"，名为归墟，"八纮九野之水，天汉之流，莫不注之"；五山漂浮其上，天帝"恐流于西极"，可见归墟仍在天地之内。',guixuText2:"「不知几亿万里」的意思是「不知是几个亿万里」：倍数不知道，数量级是给了的，和《庄子》说鲲「不知其几千里也」是同一种说法。这一段正是在回答「物有巨细乎」，夏革一路给出三万里、九千里、七万里、四十万里，到归墟用的是更高一级的「亿万」。按最小的读法：",guixuBullets:["倍数取一，即一个「亿万」；",'亿按十万计，亿万为 10⁹ 里。古代天文里数里的亿用十万，《周髀算经》古注明说"夫言亿者，十万曰亿也"；明代《天皇至道太清玉册》同一页里写天的直径"三十五万七千里"、东极到西陲"径过二亿二万三千五百里"，亿若是万万，大地就比包着它的天大了几百倍，只有按十万读才说得通；',"里按汉里到魏晋里，0.4158～0.435 公里。"],guixuConclusion:"归墟离渤海至少约 4.2 亿～4.4 亿公里，2.8～2.9 个天文单位，天地至少这么大。",rangeLabel:"范围",rangeText:"重立四极的范围是整个天地，至少约 2.8 个天文单位，按覆盖直径对照约 1.8×10⁴⁷～2.0×10⁴⁷ J，弱化弱恒星系。不取归墟这一句，同篇的「中州以东四十万里」约 16.6 万公里，对到星☆。",credibilityLabel:"可信度",credibilityText:"《汤问》全篇是夏革回答商汤，夏革就是这一篇讲道理的人，他的话按这部书的设定采信。他对不清楚的事都明说「不知也」，给出的里数可以当作可靠的下限。",verdict:[{label:"综合量级",value:"⊙弱化弱恒星系（范围对照）〔下〕——补天之阙、立四极；天地至少约 2.8 个天文单位（归墟的距离），约 1.8×10⁴⁷～2.0×10⁴⁷ J 的尺度段；能量〔缺〕。不取归墟一句时为 ⊙星☆（范围对照）〔下〕",emphasis:"primary"},{label:"保底量级",value:"补天立极，不落档——去掉的是「按范围对照」这一步",emphasis:"secondary"},{label:"位格",value:"—",emphasis:"muted"},{label:"破（破坏力）",value:"断鳌之足：对象是头顶能驮起周长约 1.25 万公里大山的巨鳌，能量〔缺〕"}]},He={heading:"五、晋唐的史书与笔记",diwang:{subheading:"（一）《帝王世纪》与《补三皇本纪》",intro1:"西晋皇甫谧《帝王世纪》（《太平御览》卷七十八引）把女娲写成帝王：",quote1:'"女娲氏，亦风姓也。承庖牺制度，亦蛇身人首，一号女希，是为女皇"',intro2:"唐代司马贞为《史记》补写的《三皇本纪》沿用这一身份，并把补天安排在她在位的末年：诸侯共工氏与祝融交战不胜，头触不周山，天柱折断。",quote2:'"女娲乃炼五色石以补天，断鳌足以立四极，聚芦灰以止滔水，以济冀州。于是地平天成，不改旧物。"',deedsLabel:"女娲做了什么",deedsText:"与《淮南子》相同的几件事，只是少了杀黑龙，起因换成了共工。",rangeLabel:"范围",rangeText:"这两种书没有写天地的尺寸，不能拿《淮南子》的里数来配。",verdict:[{label:"综合量级",value:"补天立极〔实〕，范围未写，不落档",emphasis:"primary"},{label:"保底量级",value:"同综合量级",emphasis:"secondary"},{label:"位格",value:"—",emphasis:"muted"},{label:"性（特性）",value:"风姓；蛇身人首；继伏羲而立的女皇"}]},duyizhi:{subheading:"（二）《独异志》",intro:"唐代李冗撰，卷下记：",quote:'"昔宇宙初开之时，只有女娲兄妹二人在昆仑山，而天下未有人民"',afterQuote:"两人商议结为夫妻，又觉羞耻，便上昆仑山向天祷告，以烟的聚散为验，烟合而成婚。",deedsLabel:"女娲做了什么",deedsText:"与兄长成婚，繁衍人类。没有补天，也没有抟土。",verdict:[{label:"综合量级",value:"未定级",emphasis:"primary"},{label:"保底量级",value:"—",emphasis:"muted"},{label:"位格",value:"—",emphasis:"muted"},{label:"性（特性）",value:"宇宙初开时仅有的两人之一；人类的始祖"}]}},ze={heading:"六、明清小说",fengshen:{subheading:"（一）《封神演义》",intro:'明代小说。第一回借商容之口交代她的来历："女娲娘娘乃上古神女，生有圣德"，共工触山之后"女娲乃采五色石，炼之以补青天，故有功于百姓"。补天在这里是背景里的一句话，是人物的转述。',directLead:"正面写到的事：",directList:[{title:"朝贺三圣",body:'她在诞辰这天"往火云宫朝贺伏羲、炎帝、轩辕三圣而回"。'},{title:"不能直接惩罚纣王",body:'纣王题诗亵渎，她想去朝歌，途中被两道红光挡住云路，"知纣王尚有二十八年气运，不可造次"，只得回宫。'},{title:"招妖幡",body:'从金葫芦里放出此幡，"天下群妖俱到行宫听候法旨"；她留下轩辕坟三妖，命它们去惑乱纣王。'},{title:"借法宝擒妖",body:'第九十二回命童子用伏妖索擒住牛怪金大升，又把「山河社稷图」交给杨戬去收白猿袁洪；她对杨戬说："你虽是玉泉山金霞洞玉鼎真人门徒，善会八九变化，不能降伏此怪。吾将此宝授你"。'},{title:"收回三妖",body:'第九十七回命童儿用缚妖索锁住三妖交给杨戬，并说："吾使你断送殷受天下，原是合上天气数"。'}],recordLead:"怎么记：",recordList:["她自己没有动手的场面，办事靠法宝和童子，没有可换算的破坏。","招妖幡的影响范围是「天下群妖」，对象是妖，强度的上限没有交代。","她的行事受气运和天数约束，纣王气运未尽时她不能下手。","位次上，她要去朝贺三圣；杨戬等人见她要下拜称弟子。"],verdict:[{label:"综合量级",value:"未定级——没有本人出手的破坏或整体掌控",emphasis:"primary"},{label:"保底量级",value:"—",emphasis:"muted"},{label:"位格",value:"—",emphasis:"muted"},{label:"域（影响范围）",value:"招妖幡：召集天下群妖听命〔实〕"},{label:"性（特性）",value:"持有招妖幡、伏妖索（缚妖索）、山河社稷图等法宝；受气运约束"}]},honglou:{subheading:"（二）《红楼梦》",intro:"清代小说。第一回：",quote:'"当年女娲氏炼石补天之时，于大荒山无稽崖炼成高经十二丈，方经二十四丈顽石三万六千五百零一块。娲皇氏只用了三万六千五百块，只单单剩了一块未用"',deedsLabel:"女娲做了什么",deedsText:"炼出 36,501 块巨石，用 36,500 块补天。",volumeLabel:"石头的体量",volumeList:["单块：高十二丈、见方二十四丈，即 38.4 米 × 76.8 米 × 76.8 米，约 22.6 万立方米。","炼成的总量：36,501 块，约 82.7 亿立方米，即 8.27 立方公里。","用去的 36,500 块平铺开来，约 215 平方公里。这可以看作所补缺口的大小，相当于一座大城市的市区。"],heatLabel:"炼石的热量",heatIntro:"把石料从常温加热到熔融，每立方厘米约需 3～5 千焦。",heatList:["单块：约 6.8×10¹⁴～1.1×10¹⁵ J，在弱化弱爆城的区间。","全部：约 2.5×10¹⁹～4.1×10¹⁹ J，在超爆城级（4.184×10¹⁸ J 起，6.276×10¹⁹ J 之下）。"],recordLabel:"怎么记",recordText:"这是三万多块石头、不知多长时间加起来的总量，不是一次输出，按累计、需时记为弱化。把石头送上天还要另外做功，但这一版没有写天有多高，不计。",verdict:[{label:"综合量级",value:"⊙城☆（累计 · 需时）——炼石总热量约 2.5×10¹⁹～4.1×10¹⁹ J",emphasis:"primary"},{label:"保底量级",value:"⊙弱化弱爆城——只取炼成一块石头的热量，约 6.8×10¹⁴～1.1×10¹⁵ J；去掉的是把三万多块加在一起这一步",emphasis:"secondary"},{label:"位格",value:"—",emphasis:"muted"},{label:"性（特性）",value:'炼石补天；经她煅炼的石头"灵性已通"'}]}},Ts={heading:"七、各地口传",intro:"以下各则据近现代采录的民间故事转述，没有见到原书，证据只作参考，不进入合集的最高与区间。",rows:[{region:"吴语地区（出处未能核实）",content:"女娲炼了三千三百三十万块青石拼成天；从玉帝那里偷来一只球甩到天中央，滚成圆圆的地；用五指在地上抓出江河湖海和山岭；又用黄泥造人",note:"创造天地；范围未写。偷球一事说明上面还有玉帝"},{region:"河北涉县《女娲治世》",content:"玉皇大帝派儿女伏羲、女娲下凡结为夫妻繁衍人类，二人滚磨盘为验",note:"没有可记的表现。是玉帝之女，受差遣"},{region:"土家族《盘古开天女娲补天》",content:"盘古把天砍穿、惹出大水之后，女娲来补天",note:"补天；范围未写"}]},nl={heading:"八、合集结论",rankingLead:"按已确认的作为所涉及的范围，由高到低：",rankingItems:[{title:"《列子·汤问》",body:"补天之阙、立四极，天地至少约 2.8 个天文单位〔下〕，弱化弱恒星系（范围对照），能量〔缺〕。夏革讲述。综合量级取这一版。"},{title:"《淮南子》",body:"补苍天、立四极、杀黑龙、止淫水〔实〕，范围约 9.7 万公里，能量〔缺〕。"},{title:"《补三皇本纪》",body:"补天立极〔实〕，范围未写。"},{title:"《红楼梦》",body:"炼石约 2.5×10¹⁹～4.1×10¹⁹ J，累计；所补缺口约 215 平方公里。"},{title:"《天问》《风俗通义》《说文解字》《山海经》注、《帝王世纪》《独异志》《封神演义》",body:"未定级。"}],rankingNote:"第 1～3 项按范围排，第 4 项按能量排，两种量不同，排在前面只表示涉及的对象更大，不表示能量更高。《红楼梦》把缺口写成了一座城那么大，与《淮南子》的整个天地相差好几个量级，正说明各版本不能合并。",comparisonLead:"以下几点是各版本并排之后看到的现象，只作对照，不拿来互相补充：",comparisons:[{title:"谁弄坏了天",body:"《淮南子》没有说原因；《列子》说天地本来就有不足；《论衡》所引的儒书、《补三皇本纪》和《封神演义》都说是共工撞的。"},{title:"造人的办法",body:"《风俗通义》是抟黄土；《淮南子·说林训》是几位神合力化生；《独异志》是兄妹成婚。"},{title:"身份的变化",body:"先秦两汉是神；晋唐史书里成了帝王；明代小说里又是受祭祀的神女。"},{title:"位次",body:"没有一个版本把她放在最高。上面依次出现过「帝」、伏羲、三圣、玉帝。"},{title:"本人出手的多少",body:"年代越晚，她亲自动手的事越少。《淮南子》里是自己炼石、断足、杀龙；《封神演义》里全靠法宝和童子。"}],transcriptNote:"明代朱权《天皇至道太清玉册》「生人之始」一节整段转录了《风俗通》抟土造人和《淮南子》七十化的文字，没有新增女娲的作为，归入所转录的版本，不另定级。",whyNotHigher:[{title:"不套标准宇宙",body:"各版本的天地都有写明或可比的尺寸，从几万里到《列子》的「几亿万里」。把「天」直接换成可观测宇宙，是把现代的词义加给了古代的文本。"},{title:"亿不按万万读",body:"《列子》的「几亿万里」若亿作万万，结果要大一千倍，到恒星系级的标准档。古代天文里数的亿用十万，有《周髀算经》古注和《太清玉册》同书的里数为证，本条目不取万万的读法。"},{title:"补天是修补，不是创造整体",body:"补的是天的缺口，天地本身不是她造的。只有一则口传说她拼出了整片天，属转述。"},{title:"造人不携带规模",body:"抟土造人是特性，原文还写明她力有不逮。"},{title:"断鳌足缺能量依据",body:"足有多粗、用什么断的都没有写，只能知道对象很大。"},{title:"法宝的作用不算本人的破坏",body:"《封神演义》里擒妖的是伏妖索和山河社稷图。"},{title:"累计不是单次",body:"《红楼梦》的热量是三万多块石头的总和。"}],battleVerdicts:[{title:"先指明版本",body:"跨作品比较时必须说明用的是哪一个版本的女娲。"},{title:"《淮南子》《列子》",body:"能确认的是范围，能量〔缺〕。与以能量定级的对象比较时写「不可判定」，并说明缺的是能量依据。"},{title:"《红楼梦》",body:"有能量，但属累计。与单次输出在超爆城级以上的对象比较时处于下风；与更低的对象比较时，要看对方能否在她长时间炼石的过程中打断。"},{title:"其余版本",body:"未定级，对战写「不可判定」。《封神演义》版可以补充一句：她的手段是法宝，且行事受气运约束。"}]},s0=[{title:"《淮南子》的另一个天高",body:'《天文训》还有一句"天有九野，九千九百九十九隅，去地五亿万里"，与同篇末尾算出的十万里不合。「五亿万里」怎么读没有定论，高诱在这里也没有解释数字。本条目用有算法可查的十万里；范围对照用的是《墜形训》的东西极距离，不受这一句影响。'},{title:"「亿」的读法",body:"按十万读，依据是《周髀算经》古注的说明。若按万万读，东极到西极约为两亿里，合 0.56 个天文单位，范围要改记。"},{title:"里的长度",body:"《淮南子》按汉里换算。《列子》成书年代有争议，魏晋的里略长，四十万里约为 16.6 万～17.4 万公里，结论不变。"},{title:"鳌足的长度",body:"由「用来撑天」推出与天同高，原文没有直接写，没有用于综合量级。"},{title:"《列子》的讲述者",body:"补天的话出自夏革之口，书中没有另外的旁白印证；今本《列子》的成书年代也晚于它所托的战国。本条目把夏革当作这一篇的讲述者采信；若只认正文旁白，综合量级退回《淮南子》的星△。"},{title:"归墟的距离",body:"「不知几亿万里」只给了数量级，本条目取最小读法：倍数取一、亿作十万、里取汉魏，得约 2.8～2.9 个天文单位。倍数若取「几」通常的二到三倍，范围再大两三倍，档位不变。若亿作万万，约 2800 个天文单位，覆盖对照约 1.8×10⁵³ J，到恒星系级的标准档；同类文献的证据不支持这个读法。若认为「几亿万」只是极言其远、不作数字，综合量级退回同篇的星☆〔下〕。"},{title:"《风俗通义》佚文的文字",body:"所见《太平御览》文本中间一句有衍字，本条目只引了前后两句，中间作转述。"},{title:"《红楼梦》的换算",body:"按石料加热至熔融计。原文用的是「炼」「煅炼」，若只是烧炼而没有熔化，热量约少两到三成，档位不变。石料的种类没有写，按常见岩石取区间。"},{title:"口传各则",body:"都没有见到原书，吴语地区的一则连出处也没有核实。"}],f0=[{title:"《楚辞章句》卷三《天问》（王逸注）",url:"https://zh.wikisource.org/wiki/楚辭章句/卷03"},{title:"《淮南子·览冥训》",url:"https://zh.wikisource.org/wiki/淮南子/覽冥訓"},{title:"《淮南子·天文训》",url:"https://zh.wikisource.org/wiki/淮南子/天文訓"},{title:"《淮南子·墜形训》",url:"https://zh.wikisource.org/wiki/淮南
