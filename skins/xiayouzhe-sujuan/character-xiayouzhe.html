却分散在无数平行宇宙之中"},{k:"类型",v:"硬科幻，涉及末日论证（卡特灾难）、费米悖论、宇宙自然选择、真空衰变"}],_h=[{k:"名称",v:"下游者（Downstreamers），即时间之河「下游」的人类后裔"},{k:"处境",v:"宇宙极远未来，质子衰变、物质消散之后，残存的智慧把自己嵌入一个「无损计算基质」（lossless computing substrate），可以无限延续，但没有新的输入，终将穷尽一切可能的思想"},{k:"动机",v:"其中一部分智慧认为宇宙不该走到这个结局，于是改变过去，重点是二十一世纪初"},{k:"改变过去的手段",v:"给马伦方的讯息；世界各地出生的超常儿童「蓝孩子」（Blue children，迈克尔、安娜等）；小行星克鲁伊斯内（3753 Cruithne）上的门户"},{k:"结局",v:"蓝孩子在月球上触发真空衰变，真真空泡以光速扩张，吞没太阳系并将席卷整个宇宙；衰变过程中形成的大量黑洞孕育新的子宇宙。马伦方经门户穿过一串宇宙，最终与下游者相遇"}],Na={main:{label:"综合量级",grade:"⊙宇○（弱化：需时，触发式）〔下〕",text:"标准宇宙级：摧毁可观测宇宙（直径约 930 亿光年，8.0×10⁷⁷ J）。来自下游者经蓝孩子触发的真空衰变：真真空泡以光速扩张，迈克尔说它「永远不会停止」，银河系十万年后消失，仙女座星系几百万年后消失，「最终」覆盖整个宇宙。「弱化」「需时」指这一规模要以光速扩张数百亿年才达到（衡天 0.17）；「触发式」指破坏的能量来自假真空本身，下游者一方只负责触发"},floor:{label:"保底量级",grade:"⊙弱化弱恒星系〔实〕",text:"约 9.2×10⁴⁶ J（过渡带 A，覆盖直径约 2 天文单位）。只取文中实际展示到的部分：真真空泡宽到「16 光分钟」、两亿英里时，水星、金星、地球、月球与太阳都已被吞没"},rows:[{k:"位格",v:"—（下游者的存在形式是无损计算基质，作品明说其思想终将穷尽，没有可记录的无限存在规模；跨宇宙的门户链记入影响）"},{k:"可信度",v:"主档依据：迈克尔（蓝孩子，计划的执行者，知情）给出的扩张预期，带具体时间与对象；事件本身已发生〔实〕。归因依据：蓝孩子与门户都是下游者改变过去的产物，按其意志行动（衡天 8.3.2，与天人大圣条目中类星龙的处理一致）"},{k:"破（破坏力）",v:"宇○（弱化：需时，触发式）〔下〕；已展示：直径约 2 天文单位的真真空泡〔实〕；月球先被夸克块坍缩为夸克物质再内爆碎裂〔实〕"},{k:"域（影响）",v:"改写过去 · 影响范围：本宇宙从极远未来到二十一世纪初的历史〔实〕；跨宇宙门户链 · 影响范围：马伦方经门户穿过的数以百计的宇宙，直至这条宇宙链的最上游〔实〕；宇宙繁衍机制 · 真空衰变产生的黑洞数目「超出」本宇宙恒星与星系核所能形成的「区区十亿亿」（10¹⁸）「许多个数量级」，每个黑洞孕育一个子宇宙〔实〕，具体数目〔缺〕"},{k:"算（计算层级）",v:"有限〔推〕：无损基质「没有新的输入」，终将穷尽一切可能的思想，说明状态数有限"},{k:"性（特性）",v:"无损计算基质中的长存；回溯因果、改变过去；跨宇宙门户的建造与维护；人类后裔"},{k:"横向位置",v:"蓝孩子是下游者改变过去的产物与执行者；与《起源》古圣的关系见第五节"}],footnote:"御（防御）、速（速度）没有可用的表现，未列出。"},Oh=[{sym:"⊙",def:"综合量级标记"},{sym:"宇○",def:"标准宇宙级：摧毁可观测宇宙（直径约 930 亿光年），8.0×10⁷⁷ J"},{sym:"宇▽",def:"弱宇宙级：3.7×10⁷⁶～8.0×10⁷⁷ J"},{sym:"弱化弱恒星系",def:"过渡带 A（恒星→恒星系）中覆盖直径大于 1 天文单位的一段，须写出具体焦耳数"},{sym:"弱化",def:"该规模需要时间逐步达到（衡天 0.17）"},{sym:"触发式",def:"破坏由一次触发引起、能量来自被破坏对象自身（此处为假真空的能量），不是作用者输出的能量"},{sym:"位格",def:"存在规模、计算层级、层级轴中证据过关的记录，与综合量级并列，互不推出（衡天 1.7）"},{sym:"〔实〕",def:"已确认：文本直接展示了该表现"},{sym:"〔下〕",def:"下限：只能确认至少如此"},{sym:"〔推〕",def:"推定：由已确认的表现按允许的单步规则推出"},{sym:"〔缺〕",def:"缺：文本没有可用的表现"},{sym:"〔若采信〕",def:"依赖一处未通过审查的陈述，只在采信该陈述时成立"}],Lm=['下游者是人类在宇宙热寂之后的后裔，躲进无损计算基质里长存，却面对一个永远不再有新东西的宇宙。它们回到过去改写历史：让蓝孩子出生，在克鲁伊斯内放下门户。蓝孩子最终在月球上触发真空衰变，把本宇宙推向终结，用衰变中大量形成的黑洞孕育远多于自然演化的子宇宙。马伦方领悟到的意义是："By striving for a meaningless eternity, humans denied true infinity."（「人类追求无意义的永恒，反而否定了真正的无限。」）',"量级上，下游者的最大表现是这次真空衰变：已经展示到吞没太阳的程度，按计划执行者的说明最终覆盖整个宇宙，记宇○，弱化、需时、触发式。它们创造了大量子宇宙，但数目没有给出，子宇宙也不是由它们逐一设计、掌控的，记入影响。流形中「无限多」的宇宙是世界的规模，下游者没有对整个流形做过破坏、掌控或创造，不由此推到论外。"],Km={en:"By striving for a meaningless eternity, humans denied true infinity.",zh:"人类追求无意义的永恒，反而否定了真正的无限。"},Mh=["**材料**：《流形：时间》《流形：起源》及《相空间》的英文原著段落截图（逐字核对引文）；知乎中文摘译只作定位；维基百科与书评核对情节与出版信息。手头没有完整原著，章节号〔缺〕，引文按卷标注。","**世界观推定角色量级的两步**：先确认世界多大，再确认对象对世界整体做了什么（衡天 8.1 界线 3，见守则「林飞」判例）。本作中流形是否无限是第一步，下游者是否作用于整个流形是第二步，第二步不成立时第一步不影响下游者的量级。","**归因**：蓝孩子、门户都是下游者改变过去的产物，执行的是下游者的计划；按衡天 8.3.2 记在下游者名下，风险写入存疑。"],Uu={p1:'《时间》中，安娜（蓝孩子）向莫拉解释："There are an infinite number of possible universes in the manifold. Of those only a subset -- nevertheless infinite itself -- are capable of supporting self-aware substructures."（「流形中有无限多个可能的宇宙，其中只有一个子集——尽管它本身也是无限的——能支持自我意识的子结构。」）她又说每一个内部自洽的形式系统都描述一个存在的宇宙："But there are many formal systems... each formal system, logically consistent internally, describes a possible universe, which therefore exists."',p2:"按衡天 8.1 审查这两句：",audit:[{cond:"来源",situ:"角色陈述（安娜），不是旁白；安娜受下游者影响、知情度高",result:"不满足「旁白、全知叙述或官方设定」",pass:!1},{cond:"指明对象",situ:"可能宇宙的个数",result:"通过",pass:!0},{cond:"字面用法",situ:"交代世界规则的语境",result:"通过",pass:!0},{cond:"不被推翻",situ:"未见冲突",result:"通过",pass:!0}],p3:"来源一条不过，流形的无限不确认。另外有一点数学上的约束：形式系统都由有限长的符号串写成，全部形式系统只有可数无限个。所以即使采信「每个自洽的形式系统都是一个宇宙」，流形的宇宙个数也只到 ℵ₀，不会更高。",p4:"更重要的是第二步：下游者的作为是改写本宇宙的历史、触发本宇宙的真空衰变、建造一条宇宙链上的门户，没有一处作用于整个流形。所以流形是否无限，不影响下游者的量级（衡天 8.1 界线 3）。"},Dh='科尼利厄斯与艾玛在宇宙链中领悟：能产生黑洞的宇宙可以有许多子宇宙，子宇宙经奇点与母宇宙相连，几代之后会产黑洞的宇宙占绝大多数（宇宙自然选择）。马伦方嫌这种演化太慢：即使"a whole new universe, after all, every couple of minutes"（「毕竟每隔几分钟就是一个全新的宇宙」），宇宙的演化仍是"a dim, undirected groping for complexity"（「一场黯淡、无方向的摸索」）。下游者的计划就是用真空衰变替代这种缓慢的演化。',Uh=[{title:"夸克块与月球",text:"蓝孩子用夸克块使月球坍缩成夸克物质，月球内爆碎裂，爆出一颗短暂的「新星」。迈克尔说夸克块只是工具，用来产生一次能量密度极高的脉冲，比两颗最高能宇宙射线原子核对撞还要高六个数量级（〔实〕；原文给出的是能量密度的比较，不是破坏范围）。"},{title:"真真空泡",text:'脉冲触发真空衰变，泡以接近光速扩张，一秒多吞没地月距离，几分钟内大过太阳，太阳在三到五秒内被泡壁吞没；泡宽到 16 光分钟、两亿英里时，内行星都已消失。泡内物理定律不同，在成核后几微秒就开始引力坍缩，迈克尔称之为"the true vacuum, Malenfant, the final state of the universe"（「真真空，宇宙的最终状态」）。'},{title:"扩张预期",text:"迈克尔说这是宇宙结构的根本改变，永不停止，以光速扫过一切，银河系十万年后消失，仙女座星系几百万年后消失，「需要时间，但最终——」。马伦方随即想到，它很快会成为覆盖整个宇宙的一堵墙。"},{title:"目的",text:'"This is just a better way of making black holes, and budding off new universes."（「这只是制造黑洞、孕育新宇宙的更好办法。」）迈克尔："The black holes created as the vacuum decay proceeds will overwhelm by many orders of magnitude the mere billion billion that our universe might have created through its stars and galaxy cores."（「真空衰变中形成的黑洞，将以许多个数量级压倒本宇宙靠恒星与星系核能形成的区区十亿亿个。」）"There will be many daughter universes -- universes too many to count, universes exotic beyond our imagining -- and many, many of them will harbor life and mind."（「将会有许多子宇宙——多到数不清，奇异到超出想象——其中很多很多会孕育生命与心灵。」）'}],Pn=[{t:"一秒多",o:"吞没地月距离"},{t:"三到五秒",o:"太阳被泡壁吞没"},{t:"几分钟内",o:"大过太阳"},{t:"16 光分钟",o:"内行星都已消失"},{t:"十万年",o:"银河系消失"},{t:"几百万年",o:"仙女座星系消失"},{t:"最终",o:"覆盖整个宇宙"}],Hh='克鲁伊斯内的门户把马伦方、艾玛与科尼利厄斯送进另一个宇宙，科尼利厄斯判断那是「最深的过去」。此后他们沿门户穿过一串宇宙，每隔几分钟一个，书评统计为数以百计。马伦方猜想："some unimaginable agency of the downstreamers who built this chain -- monitor the portals across the universes, repair them after cosmological accidents?"（「是不是建造这条链的下游者中，有某种难以想象的力量在监视各宇宙中的门户，在宇宙事故后修复它们？」）',li={head:"**主档：真空衰变，宇○（弱化：需时，触发式）〔下〕。**",bullets:["**事件已发生**：真空衰变被触发、泡已吞没内太阳系，〔实〕。","**最终规模**：迈克尔是计划的执行者，知情；他的说明带具体对象与时间（银河系十万年、仙女座几百万年），按衡天 0.14.1 第二条判据，带具体数据的陈述可视同实际表现。真空衰变在物理上是自持的相变，一旦开始不需要外部持续供能，「最终覆盖整个宇宙」与这一机制一致。按 0.17，这一规模要以光速扩张数百亿年才达到，记弱化并注明需时。","**触发式**：下游者一方提供的是一次高能脉冲，摧毁宇宙的能量来自假真空本身。记录的是这次作用实际造成的破坏范围；按衡天 1.4，破坏不推出防御，所以这一档不说明下游者能承受同等规模的攻击。","**归因**：执行者是蓝孩子。蓝孩子的出生是下游者改变过去的结果，马伦方的领悟把这件事归于「我们」——人类回到遥远的上游，与「我们最后的孩子」蓝孩子交谈，纠正了错误的未来。按衡天 8.3.2，记在下游者名下。"],floor:"**保底：已展示部分，弱化弱恒星系约 9.2×10⁴⁶ J〔实〕。** 文中实际看到的泡宽约 16 光分钟（约 2 天文单位），按过渡带 A 的覆盖直径 2 天文单位计。",middle:"**中间档**：只采信迈克尔点名的对象（银河系、仙女座），覆盖半径约 250 万光年，按衡天 4.9 的面积换算约 2×10⁶⁹ J，落在星系级与星系团级之间，同样需时。"},Af=[{exp:46.96,label:"保底 · 弱化弱恒星系",value:"约 9.2×10⁴⁶ J",note:"已展示：泡宽约 16 光分钟（约 2 天文单位）",tag:"〔实〕"},{exp:69.3,label:"中间档 · 银河系与仙女座",value:"约 2×10⁶⁹ J",note:"覆盖半径约 250 万光年，介于星系级与星系团级之间",tag:"需时"},{exp:77,label:"存疑 · 宇▽ 弱宇宙级",value:"约 1×10⁷⁷ J",note:"若宇宙加速膨胀，泡只能到达事件视界之内",tag:"风险"},{exp:77.9,label:"主档 · 宇○ 标准宇宙级",value:"8.0×10⁷⁷ J",note:"摧毁可观测宇宙，直径约 930 亿光年",tag:"〔下〕"}],Rh=[{ability:"改写过去",content:"讯息、蓝孩子、克鲁伊斯内门户",range:"本宇宙从极远未来到二十一世纪初的历史",evidence:"〔实〕"},{ability:"跨宇宙门户",content:"建造并可能维护一条穿越数以百计宇宙的门户链，上溯到「最深的过去」",range:"数以百计的宇宙（元·多，数目只到「数以百计」）",evidence:"〔实〕（门户存在与穿越）；维护为马伦方的猜想"},{ability:"宇宙繁衍",content:"真空衰变形成的黑洞远多于 10¹⁸，每个孕育一个子宇宙",range:'子宇宙数目"too many to count"，具体数目〔缺〕',evidence:"〔实〕"}],Ch='子宇宙由黑洞奇点按物理过程自然孕育，下游者没有逐一设计其内容或规则，按衡天 0.11 不构成整体掌控，只记影响。"too many to count"按 0.2 读作极多，不读作无限。',qh="维基百科对开篇的概括是：智慧嵌入无损计算基质后可以无限延续，但没有新的输入，终将穷尽一切可能的思想。能穷尽，说明可能的思想（状态）是有限的，记有限〔推〕，具体规模〔缺〕。",Bh=[{k:"长存",v:"在物质消散之后仍以无损基质延续"},{k:"回溯因果",v:"能把影响送回过去并改写历史；《起源》中解释了这类改写的机制：每个量子事件都是过去与未来的「握手」，改动过去会让宇宙从改动点起重新编织，直至再次自洽"},{k:"门户",v:"跨宇宙门户的建造者"}],Ou={p1:'《起源》中，根本（Nemoto）与真卡托（Manekato）推断，古圣"constructed a manifold of universes -- an infinite number of universes"（「构建了一个宇宙流形——无限多个宇宙」），"We believe the Old Ones created, not just a multiplicity of daughter universes, but an infinite number"（「我们相信古圣创造的不只是许多子宇宙，而是无限多个」），手段是"The branching of universes, deep into the hyperpast"（「宇宙的分支，深入超过去」）。根本又推断古圣就是人类的后裔；艾玛的信里写"Maybe they really were us"，同时说"Or at least humans from some variant of our future history"（「或者至少是我们未来历史某个变体中的人类」）。',why:"**为什么不并入下游者**：三部曲发生在不同的现实中，各卷的马伦方「不是同一个」。古圣与下游者都是人类的未来后裔，但属于不同的现实，作品没有写明二者是同一群体。本条目不把古圣的作为记在下游者名下。",canHead:"**古圣的作为能否确认**：",can:[`**来源**：都是角色的推断——"We believe""must have come to believe""We don't know how they did it"。按衡天 0.14.1，角色平静陈述记为意图或潜力；按 0.14.2，说话人不在场，也不知道手段。不满足 8.1 的来源条件。`,'**规模上限**："in that infinite ensemble, all logically possible universes must exist"（「在那个无限的集合中，所有逻辑上可能的宇宙都必然存在」）。如上所述，逻辑上可能的宇宙若由形式系统刻画，只有可数无限个，到论外门槛为止。','**「流形的流形」**：巴博说"Or perhaps the manifold is itself merely one thread in a greater tapestry"（「或许流形本身只是一幅更大挂毯中的一根线」），是「或许」开头的猜想，不作记录。','**「不可数」**：同书描述宇宙由"uncountable trillions of such tiny handshakes"（「数不清的上万亿次微小握手」）编织而成。这里的 uncountable 是「数不清」，紧接着的"trillions"是有限数，按衡天 8.1 界线 1，不读作不可数基数。'],record:"**记录（古圣，单列）**：控 外·门（ℵ₀）〔若采信〕（创造无限多宇宙的流形，依据角色推断）；已展示的表现是在平行宇宙之间游荡的红月（书评描述为火星大小的天体），跨宇宙搬运一颗行星级天体，记影响，量级〔缺〕。"},Hu={intro:"按衡天 1.3，主档取破坏、整体掌控两维中证据为〔实〕或〔下〕的最高者：",items:[{k:"破",v:"宇○（弱化：需时，触发式）〔下〕——真空衰变的最终规模；"},{k:"破",v:"弱化弱恒星系约 9.2×10⁴⁶ J〔实〕——已展示部分；"},{k:"控",v:"〔缺〕。"}],conclusion:"综合量级为 ⊙宇○（弱化：需时，触发式）〔下〕，保底量级为 ⊙弱化弱恒星系（约 9.2×10⁴⁶ J）〔实〕。",whyNotHigher:["流形无限是世界规模，下游者没有作用于整个流形（8.1 界线 3）；","子宇宙「数不清」没有数目，也不是整体掌控；","门户链只到「数以百计」的宇宙，是影响而不是破坏；","《起源》古圣的无限流形是另一个现实中的角色推断，不归下游者，且即使采信也只到论外门槛。"],battle:"默认比较综合量级。下游者的主档是触发式破坏，不说明防御或直接输出能力；与以直接输出为主的对象比较时，须写明这一点。"},Yh=[{title:"宇宙加速膨胀",text:"现实宇宙在加速膨胀，以光速扩张的泡只能到达宇宙事件视界之内（今天的固有距离约 165 亿光年），最终覆盖的直径约为可观测宇宙的三分之一多，按 4.9 换算约 1×10⁷⁷ J，落在宇▽（弱宇宙级）。原文没有写本作宇宙是否加速膨胀，迈克尔说的是「最终」覆盖一切，本条目按原文取宇○，这一风险单列。"},{title:"归因",text:"蓝孩子是否完全按下游者的意志行动，原文通过马伦方的领悟交代，不是下游者直接出手。若认定蓝孩子是自主的第三方，真空衰变应记在蓝孩子名下，下游者只保留改写过去、门户链等影响。"},{title:"门户的维护者",text:'马伦方"Or did someone..."是猜想，「下游者建造了这条链」是他的前提，门户链的建造按情节概括采信，维护不采信。'},{title:"章节号",text:"手头没有完整原著，引文只标卷名；英文引文据原著截图逐字核对，中文为本条目的翻译。"}],Gh=[{label:"维基百科 · Time (novel)",url:"https://en.wikipedia.org/wiki/Time_(novel)"},{label:"维基百科 · Manifold Trilogy",url:"https://en.wikipedia.org/wiki/Manifold_Trilogy"},{label:"维基百科 · Space (Baxter novel)",url:"https://en.wikipedia.org/wiki/Space_(Baxter_novel)"},{label:"NESFA 书评 · Origin",url:"https://archive.nesfa.org/reviews/Olson/Origin.html"},{label:"Logos con carne · Stephen Baxter: Manifold",url:"https://logosconcarne.com/2020/04/04/stephen-baxter-manifold/"},{label:"Ansible · David Langford 评 Time",url:"https://ansible.uk/writing/time.html"},{label:"Goodreads · Time 摘句",url:"https://www.goodreads.com/work/quotes/97079"},{label:"《衡天⊙多维战力量级体系（第五版）》《衡天工作守则与判例》"}],_f=[
