着谁」、第 1450 章「石罐揭开一角惊悚世间」、第 1478 章「诡异源头」"],["版本","《圣墟》2021 年 2 月发布终章，此后重写为「第二次大结局」"],["原文","第三篇全文见项目原文区；第一、二篇按转载全文核对"]]},{"type":"heading","level":2,"text":"角色信息"},{"type":"table","header":["项目","内容"],"rows":[["名称","原文没有给出名字。番外称「病人」，正文末章的预告作「病者」；读者通称「铜棺之主」「三世铜棺之主」"],["原文中的称呼","「面色苍白的男子」「小院的主人」；三天帝称他为「前辈」"],["境界","祭道之上：本人说\\"祭道之上，我又祭掉了过去，现在，未来，自己，诸世，大道之外\\"，三天帝说\\"前辈这种境界，祭道之上\\""],["外形","面色苍白，不时咳血，与三天帝\\"长得很像\\""],["居所","一座小院：湖中有万劫轮回莲，院里有大道树、一株花树、磨盘和煮茶的小火炉"],["遗物","骨灰由三重铜棺和石罐盛放，葬入高原。三重铜棺即三部曲中的青铜古棺：《遮天》开篇由\\"九具庞大的龙尸拉着\\"，出现在宇宙深处（九龙拉棺）。石罐后来由楚风在昆仑山下捡到"],["衍生物","他的负面情绪化作十种病根，也就是高原上十种原初物质的由来"],["结局","三天帝曾帮他解脱，抹去他在世间的全部痕迹。番外中三天帝把他具现出来，追溯他的过去；最后与他碰杯饮茶，他脸上的苍白褪去"]]},{"type":"heading","level":2,"text":"量级栏"},{"type":"table","header":["项目","定级"],"rows":[["**综合量级**","**⊙宇◆〔实〕**——极宇宙级（直径为可观测宇宙的 1 万～1 亿倍，或一次摧毁 1 亿个以上的标准宇宙，能量 8.0×10⁸⁵～8.0×10⁹³ J）。依据：三天帝的手指触到他眉心时，他的气质骤变，\\"附近，周围，亿万无穷宇宙成灰\\"；在他说话之间，这些宇宙又全部复原。破坏和整体掌控同档。可信度：破坏〔实〕、整体掌控〔实〕"],["**位格**","—：没有证据过关的项目。追溯路径上的汇聚结构未过明确设定陈述（见「设定宣称」一行），层级轴只有结构标注（祭道之上，倍率〔缺〕），计算层级没有可用的表现（衡天 1.7）"],["破（破坏力）","宇◆（元·亿万，即一次同时毁灭至少 1 亿个完整宇宙，当量 ≥ 8.0×10⁸⁵ J）〔实〕"],["控（整体掌控）","宇◆（让同一范围内已成灰的宇宙全部复原）〔实〕"],["速（速度）","一刹那波及亿万个宇宙。投送速度远超光速〔下〕；宇宙之间的排列与距离原文没有给出，所以不给倍数"],["性（特性）","自我抹除（过去、现在、未来与他人记忆中都不留痕迹）；三天帝也难以将他完整复活；在自己引发的毁灭中\\"唯有他永存世间\\"；\\"从无到有，又从有到无\\"的循环"],["层级轴","祭道之上，又祭掉了\\"过去，现在，未来，自己，诸世，大道之外\\"。只作结构标注，倍率〔缺〕"],["存疑上限","碰杯时\\"无尽的宇宙熄灭，无穷原初之地消散，一切都不复存在了\\"：施动者不明，不进主档"],["设定宣称（未过门槛）","追溯路径上的汇聚结构，按字面读法上限为「外·门 · 结构 ω 层汇聚」。它不满足明确设定陈述的第三、四条，不过论外门槛，不进任何维度；广义无限区没有入口（第四节）"],["若采信的过往","磨灭\\"无穷尽的原初之地\\"、\\"一念间，重现了所有\\"：来源过不了归因与知情度审查，只记在存疑里（第五节）"]]},{"type":"para","text":"防御与计算层级没有可用的表现，未列出。"},{"type":"heading","level":3,"text":"量级栏用语说明"},{"type":"table","header":["代字或标签","全称与含义"],"rows":[["位格","存在规模、计算层级、层级轴中证据过关的记录，逐项列出，与综合量级并列，互不推出（衡天 1.7）"],["⊙","综合量级标记"],["宇◆","极宇宙级：一次摧毁直径为可观测宇宙 1 万～1 亿倍的范围，或同时摧毁 1 亿～1 亿亿个标准宇宙，8.0×10⁸⁵～8.0×10⁹³ J"],["元·亿万","数量轴：一次作用同时波及的完整宇宙数目为「亿万」，按可确认的最小值 1 亿计"],["外·门","论外门槛：可数无限（ℵ₀），有限区间走完之后的第一级真正的无限"],["ω","序数：第 1、2、3……层，没有最后一层；只表示结构有多深，不表示规模"],["广义无限区","有限数中，必须用幂塔、箭头等迭代记号才能写出的部分，入区线为标准宇宙能量的 10↑↑3（10 的 10¹⁰ 次方）倍"],["〔实〕","已确认：文本直接展示了该表现"],["〔下〕","下限：只能确认至少如此"],["〔缺〕","缺：文本没有可用的表现"]]},{"type":"heading","level":2,"text":"概述"},{"type":"para","text":"三世铜棺之主在三部曲正文中几乎只以遗物出现：九龙拉着的青铜古棺、楚风的石罐、高原上的十种原初物质。他本人只在《圣墟：番外》中登场，是一个在祭道之上又祭掉一切、最后厌世自焚的存在。"},{"type":"para","text":"他在番外里只有两次直接表现，都发生在三天帝面前。第一次，三天帝点他眉心，他的气质骤变，附近亿万个宇宙一刹那成灰；接着在他说话之间，这些宇宙又全部复原。原文给出了「亿万」这个数目，所以主档落在宇◆。第二次是碰杯时一切熄灭又复原，但施动者没有写明。"},{"type":"para","text":"番外对他还有大量「无穷」「无尽」的描写：追溯路径上层层汇聚的「原初之地」，追溯到的过往里被他磨灭的「无穷尽的原初之地」。这些描写与已实现的数据（亿万）是割裂的，而且割裂就出在原文自己身上。本条目把两边分开记录：主档只取已实现的表现；无限描写的字面读法上限单列为设定宣称，并写明它为什么不过门槛。"},{"type":"heading","level":2,"text":"一、出处与证据可靠性"},{"type":"table","header":["出处","叙述方式","处理"],"rows":[["番外第三篇·小院中的当下场景","全知旁白直接叙述","按已确认处理"],["番外第三篇·追溯到的过往","三天帝\\"由一抹痕迹，拘禁出部分信息\\"，再\\"演化出这个人的人生轨迹\\"；事后病人本人说\\"你们所见，所闻，都是我想给你们看到的\\"，三天帝只答\\"我相信手中之剑\\"，没有证实","按衡天 0.14.2（归因与知情度审查）：重塑自部分信息，本人又对其真实性提出疑问，不能单独作证"],["番外第一篇","荒天帝凭大道树、万劫轮回莲追溯病人的痕迹，旁白叙述","自我抹除的特性按已确认处理"],["《圣墟》终章","旁白描述祭道之上这一境界","境界描述，按 1.4 不直接推出任何维度"]]},{"type":"para","text":"番外的引文均按项目原文区的第三篇全文和转载的第一、二篇全文逐字核对。原文第三篇有一处\\"三天地由一抹痕迹\\"，「天地」当为「天帝」的笔误，引用时照录。"},{"type":"heading","level":2,"text":"二、关键场景"},{"type":"heading","level":3,"text":"点眉心：亿万宇宙成灰，又复原"},{"type":"para","text":"三天帝为他把脉之后，\\"同时伸出一指，点向他的眉心\\"："},{"type":"quote","paras":["在他们的手指触及他的眉心，追溯源头时，轰的一声，面色苍白的男子气质瞬间变了。","一刹那，无尽时光海蒸干，诸世空间粉碎，大道破灭，附近，周围，亿万无穷宇宙成灰，唯有他永存世间。"]},{"type":"para","text":"随后\\"一道威严的声音传来\\"。他看清是三人之后，\\"又释然了\\"，说\\"我已不想留下痕迹，何必让我再现\\"，接着："},{"type":"quote","paras":["在他说话间，无尽成灰的宇宙皆已恢复，无数的时光海平静无波，大道内外皆自然，院中花香依旧。"]},{"type":"para","text":"三天帝\\"波澜不惊，并没有觉得意外\\"。"},{"type":"heading","level":3,"text":"追溯：层层汇聚的原初之地"},{"type":"para","text":"三天帝\\"穿过男子的身影\\"去追溯他的源头："},{"type":"quote","paras":["出现在无尽时空外，无限存在的宇宙外，而后又归于原始状态的一点。","接着，他们又自这一点眺望，无尽初始之态的点，无尽这样同级的原初之地纷呈，他们又再次横渡而去。","随后，他们又从这无穷的原始状态汇聚的“无边无限”中，归为“一”，接着再次追溯，眺望中，又发现同级别中还有无尽的一。","就这样，无尽的一呈现后，又再被聚集，又回一点……这是一个持续的循环，无止尽的更迭，往复。"]},{"type":"para","text":"紧接着原文写道：\\"对于其他生灵来说，即便能做到，这也是个体力活，不胜其烦。\\"三天帝则\\"刹那就知道了一切\\"，最后找到\\"同一抹残留的气息\\"：\\"这个人确实不存在了，但是，自我磨灭的不彻底，还有一点痕。\\""},{"type":"heading","level":3,"text":"碰杯：一切熄灭，又复原"},{"type":"para","text":"病人问三天帝是否相信所见所闻，三人答完，四人举杯："},{"type":"quote","paras":["四杯相撞，可却只有三只杯子发出声音。","一刹那，无尽的宇宙熄灭，无穷原初之地消散，一切都不复存在了，诸世彻底黑暗下去，永世沉沦。"]},{"type":"para","text":"此后病人\\"其身影在黑暗中重现，凝实，脸上的苍白之色消失\\"，三天帝的身影\\"也重现\\"。第二次碰杯时四只杯子都响了，\\"那些成灰的时空，本源宇宙，原初之地，混沌，大道之外，言语难以描述的所在，都在他们的眸光下瞬间恢复\\"。"},{"type":"heading","level":2,"text":"三、分维度分析"},{"type":"heading","level":3,"text":"破（破坏力）"},{"type":"para","text":"**证据**：点眉心一段，\\"附近，周围，亿万无穷宇宙成灰\\"。这是旁白对已发生事件的叙述，施动者是气质骤变的病人本人。"},{"type":"para","text":"**数目**：\\"亿万\\"是概数，用来形容极多。按衡天 0.1（不自行假设数字），取文本能确认的最小值「亿」，即 10⁸ 个宇宙。同一句里\\"亿万\\"和\\"无穷\\"连用，按 5.6 的邻近量化信号，优先采信具体的数目，「无穷」作修饰处理。\\"附近，周围\\"也说明这是一片有边界的范围，不是全部。"},{"type":"para","text":"**当量**：宇宙的大小原文没有写，按衡天 6.3 取标准宇宙 8.0×10⁷⁷ J，当量 ≥ 10⁸ × 8.0×10⁷⁷ J = 8.0×10⁸⁵ J，正好是宇◆的下沿。若把「亿万」读成「万亿」（10¹²），当量为 8.0×10⁸⁹ J，仍在宇◆以内。要超出宇◆，需要原文写到 1 亿亿（10¹⁶）个以上。"},{"type":"para","text":"**一次作用**：成灰发生在同一刹那、出自同一个源头，符合 6.3「一次作用同时波及 N 个完整宇宙」。"},{"type":"para","text":"**同句里的其他对象**：「时光海」「诸世空间」「大道」也被毁坏，但原文没有给出它们与宇宙之间的数量关系，不另计当量。"},{"type":"para","text":"**施动者是具现**：三天帝\\"难以将他完整的复活过来\\"，原文也说\\"这个人确实不存在了\\"，所以当场的他是一个不完整的具现。具现是他现存的唯一形态，这次表现记在他名下；完整状态下的上限没有观测到，记〔隐〕。按 0.20，场地小不压低上限，但也不据此放大。"},{"type":"para","text":"**破坏力记录：宇◆（元·亿万，当量 ≥ 8.0×10⁸⁵ J）〔实〕；完整状态〔隐〕。**"},{"type":"heading","level":3,"text":"控（整体掌控）"},{"type":"para","text":"**证据**：\\"在他说话间，无尽成灰的宇宙皆已恢复，无数的时光海平静无波，大道内外皆自然\\"。"},{"type":"para","text":"**处理**：已经成灰的宇宙全部复原，涉及该范围内的全部物质与时空本身，满足衡天 0.11 整体掌控「同时覆盖物质与范围」的条件。复原的对象就是刚才成灰的那一批，范围相同，数目同样取 10⁸。原文用被动句「皆已恢复」，没有写施动者；复原发生在他说话之间，三天帝没有任何动作，按上下文归于病人。"},{"type":"para","text":"**整体掌控记录：宇◆（复原同一批亿万宇宙）〔实〕。**"},{"type":"heading","level":3,"text":"速（速度）"},{"type":"para","text":"毁灭发生在\\"一刹那\\"，范围是亿万个宇宙。按衡天 1.4，投送速度的下限为覆盖直径除以时间；宇宙之间的排列与距离原文没有给出，只能确认远超光速。"},{"type":"para","text":"**速度记录：一刹那波及亿万宇宙，投送远超光速〔下〕，倍数〔缺〕。**"},{"type":"heading","level":3,"text":"性（特性）"},{"type":"table","header":["特性","原文","证据状态"],"rows":[["自我抹除","第一篇：\\"早已不存在过去，现在，未来，彻底绝了自身的痕迹，道中不显，时光中无形，活着的、死去的诸世中，所有人心中都无关于他的念\\"；荒天帝看到他的影子\\"最后他还是破散了，似是被强行自我斩灭\\"","〔实〕（旁白）"],["难以复活","三天帝\\"强大如他们，却难以将他完整的复活过来\\"；只能从\\"一点痕\\"着手追溯","〔实〕"],["自身不受波及","自己引发的毁灭中\\"唯有他永存世间\\"","〔实〕；是自身力量的事件，不按衡天 9.2 记作防御"],["直接领悟","\\"他自然直接明白了缘由究竟等\\"","〔实〕"],["有无循环","自述\\"我从无到有，又从有到无，如此再到有，循环往复下去……我便病了\\"","平静自述，按 0.14 不作规模"],["祭掉一切","自述\\"祭道之上，我又祭掉了过去，现在，未来，自己，诸世，大道之外\\"","平静自述；「祭掉」的对象是关系与范围，原文没有给出规模"],["痊愈","碰杯之后\\"脸上的苍白之色消失，渐渐有了光\\"","〔实〕"]]},{"type":"para","text":"他小院里的大道树\\"满树亿万宇宙泛出微光\\"，这是树的体量，按衡天 0.6（体量不等于破坏）不算作他的输出。"},{"type":"heading","level":3,"text":"层级轴"},{"type":"list","ordered":false,"items":[{"text":"**位置**：祭道之上，且自述此后又「祭掉」了过去、现在、未来、自己、诸世和大道之外；在追溯到的过往中，\\"超越了所有，他是唯一\\"。"},{"text":"**分流**（衡天 7.2）：天然处于高位，乙类倾向。"},{"text":"**跃迁门槛**（衡天 7.3）：原文没有给出他所在层次与下层之间的强度差，已确认的对下压制只有亿万宇宙这一次。"},{"text":"**记录**：层级：祭道之上并再次祭掉一切（乙类倾向）· 基准：三部曲的宇宙 · 倍率〔缺〕。按衡天 7.9 只作结构标注，不进主档，不还原为能量。"}]},{"type":"heading","level":2,"text":"四、无限描写与有限数据的割裂"},{"type":"para","text":"番外里关于病人的「无限」描写主要有两处：追溯路径上层层汇聚的原初之地，以及追溯到的过往中被他磨灭的\\"无穷尽的原初之地\\"。已实现的数据却是有限的亿万。问题在于：这些描写该读成可数无限（ℵ₀），还是读成广义无限区那种必须用迭代记号才能写出的有限数？"},{"type":"heading","level":3,"text":"原文自己给出的数字"},{"type":"table","header":["位置","原文","数字与修饰的关系"],"rows":[["点眉心","\\"亿万无穷宇宙成灰\\"","「亿万」与「无穷」修饰同一批宇宙"],["追溯到的过往","\\"亿万无止境的原始大宇宙毁去\\"","「亿万」与「无止境」连用"],["三天帝的境界","\\"所谓的永恒、道、亿万世界、所有时空、无量宇宙之外\\"","境界描述里的世界数目写作「亿万」；终章同一段描述写作\\"大千世界\\""],["追溯结构","\\"无限存在的宇宙\\"\\"无尽这样同级的原初之地\\"\\"同级别中还有无尽的一\\"","只有「无限」「无尽」，没有任何一层的数目，也没有层数"],["追溯结构之后","\\"对于其他生灵来说，即便能做到，这也是个体力活，不胜其烦\\"","逐层走完被写成一件费力、但可以完成的事"]]},{"type":"heading","level":3,"text":"字面读法的上限：外·门 · 结构 ω 层汇聚"},{"type":"para","text":"把\\"无限存在的宇宙\\"\\"无尽这样同级的原初之地\\"\\"无尽的一\\"都按字面读成可数无限，这个结构的形态是："},{"type":"list","ordered":true,"items":[{"text":"第 0 层：无限个宇宙，\\"归于原始状态的一点\\"，即一个原初之地；"},{"text":"第 1 层：无尽个同级的原初之地，汇聚为\\"一\\"；"},{"text":"第 2 层：同级的\\"无尽的一\\"，再汇聚为一点；"},{"text":"如此\\"无止尽的更迭\\"。"}]},{"type":"para","text":"每一层「汇聚」都是把可数个对象打包成一个点，层数也是可数的。可数个可数集合的并仍是可数集，所以无论汇聚多少层，所涉及的结构总数始终是 ℵ₀。层数只加深结构，不增加规模（衡天 8.3）。字面读法的上限因此是「外·门 · 结构 ω 层汇聚」，不会再往上。"},{"type":"para","text":"这还只是世界的结构。三天帝是\\"穿过男子的身影\\"走完这条路，最后找到他残留的\\"一点痕\\"：这条路说明的是他与这个结构的位置关系，而不是他摧毁或掌控了这个结构。按衡天 8.1 界线第 3 条（世界无限不等于角色无限）与 8.4（关系不是规模），即使采信，也只能记作结构标注。"},{"type":"heading","level":3,"text":"为什么不过论外门槛"},{"type":"para","text":"按衡天 8.1「明确设定陈述」逐条审查追溯结构这一段："},{"type":"table","header":["条件","本段情况","结果"],"rows":[["来源","全知旁白","通过"],["指明对象","说清了是什么在无限：宇宙的个数、同级原初之地的个数、同级的「一」的个数","通过"],["字面用法","同一篇里，「无穷」「无止境」两次紧跟在「亿万」后面修饰同一类对象，三天帝的境界描述也写「亿万世界」；作者用「无穷」「无尽」作修饰，前后用法不一致","不通过"],["不被推翻","紧接其后的\\"即便能做到，这也是个体力活\\"把逐层走完写成费力但可完成的劳动，与真正的无限层结构相冲突；\\"这是一个持续的循环，无止尽的更迭，往复\\"是进行中的过程，与 8.1 反例「永远还有更高的一层」同型（0.17）","不通过"]]},{"type":"para","text":"四条中有两条不满足，按 8.1 不过门槛，回到 0.2，把「无限」「无尽」默认为修饰。"},{"type":"heading","level":3,"text":"为什么进不了广义无限区"},{"type":"para","text":"广义无限区里全是有限数，入区要的是「实际达到的规模须用迭代记号才能写出」，证据只能是结构或明确数值（衡天 5.3）："},{"type":"list","ordered":false,"items":[{"text":"**字面读法不落在这里**：字面读法是 ℵ₀，比广义无限区更高，而且是另一种性质的量。5.3 明说本区不接受设定陈述式的「无限」。"},{"text":"**有限读法也落不进来**：把「无尽」读成某个巨大的有限数，就需要知道每一层有多少个、一共多少层。原文每一层都只写「无尽」，层数只写「无止尽」和省略号，按 0.1 不能自行指定数字。即使借用唯一出现过的「亿万」作每层的个数，k 层汇聚也只得到 10⁸ᵏ 个宇宙，这是普通指数，仍属宇宙级（6.3）；要达到入区线 10↑↑3（10 的 10¹⁰ 次方），需要原文写出约 12.5 亿层以上，或写明层数本身由上一层递归生成。原文两者都没有。"}]},{"type":"para","text":"所以这段描写只有两种读法：按字面读是 ℵ₀，但不过门槛；按修饰读则没有数目，回到已实现的亿万。广义无限区处在两者之间，原文没有任何一处落在那里。"},{"type":"heading","level":3,"text":"记录"},{"type":"list","ordered":false,"items":[{"text":"**主档**：取已实现的表现，宇◆〔实〕（第三节）。"},{"text":"**设定宣称**：外·门 · 结构 ω 层汇聚（字面读法上限；未过衡天 8.1；是世界结构及他与该结构的位置关系，不是他的破坏或掌控）。"},{"text":"**广义无限区**：无入口。"},{"text":"若后文或官方资料给出某一层的明确数目或层数，按 5.3 重新审查。若给出与全文一致、未被推翻的平实交代，按 8.1 重新审查。"}]},{"type":"heading","level":2,"text":"五、追溯到的过往（若采信）"},{"type":"para","text":"三天帝重塑出的人生轨迹，规模最大的几句是："},{"type":"table","header":["原文","施动者","处理"],"rows":[["\\"他经历过族灭，界灭，无尽时空，亿万无止境的原始大宇宙毁去，只剩下了他自身\\"","被动句，\\"经历过\\"，未写施动者","不是他的战绩"],["\\"他在对手组成的生灵海中，大道汪洋外，厮杀，争渡，斩尽所有\\"","病人","对手的规模没有写"],["\\"无尽的时空，宇宙，混沌，道，重启了不知道多少次，被他一遍又一遍的祭掉\\"","病人","多次分别作用，按衡天 0.15.1（多击不认）各次单独定级，原文没有单次的数目"],["\\"无穷尽的原初之地，一切都被他磨灭干净，从古到今，什么都不存在了，只剩下这样一个生灵\\"","病人","若采信且按字面，是一次作用于可数无限个原初之地"],["\\"哪怕一念间，重现了所有，复活了亲朋故友\\"","病人","若采信，是整体掌控"]]},{"type":"para","text":"**不进任何维度的原因**："},{"type":"list","ordered":true,"items":[{"text":"**来源**（衡天 0.14.2）：这段经历是三天帝\\"由一抹痕迹，拘禁出部分信息\\"后\\"演化出\\"的；病人随即说\\"或许，我不由自主，不愿给你们真相\\"，\\"你们相信所见，所闻吗，不怕一切都是虚假的吗？！\\"。「记忆可靠」一项不通过，又没有独立证据，按 0.14.2 只在存疑中记录原话。"},{"text":"**规模**：即使采信，\\"无穷尽的原初之地\\"也要再过 8.1，与第四节同理，字面用法与不被推翻两条都不满足。"}]},{"type":"para","text":"过往的后半段（斩去自我、负面情绪化为十种病根、自焚、以三重铜棺与石罐盛放骨灰、葬入高原）与《圣墟》正文的高原、诡异、石罐、铜棺情节相接，有独立的对应，可以作为角色经历采用；前半段的毁灭规模没有这样的对应。"},{"type":"heading","level":2,"text":"六、综合定级"},{"type":"para","text":"**结论：⊙宇◆〔实〕（破坏、整体掌控同档）。**"},{"type":"list","ordered":false,"items":[{"text":"**主档来源**：点眉心一段，亿万宇宙一刹那成灰〔实〕，又在他说话间全部复原〔实〕。两者都是旁白叙述的已发生事件，数目取「亿万」的最小值 10⁸，当量 ≥ 8.0×10⁸⁵ J。"},{"text":"**为什么不更高**：","children":[{"text":"碰杯时的「一切熄灭」施动者不明（见存疑）；"},{"text":"汇聚结构和追溯到的过往中的「无穷」不过 8.1；"},{"text":"祭道之上的境界描述按 1.4 不推出维度；"},{"text":"已实现的表现中，原文给出的最大数目就是「亿万」。"}]},{"text":"**证伪核对**（衡天 5.6）：主档用的「亿万」本身是有限数，不涉及无限宣称；「无穷」一词命中邻近量化信号，已按修饰处理。"},{"text":"**风险点**：","children":[{"text":"当场的他是不完整的具现，完整状态未观测〔隐〕；"},{"text":"复原一句没有写施动者，按上下文归于病人；若改归三天帝，整体掌控一项撤回，主档仍由破坏维持在宇◆；"},{"text":"「亿万」若读作单纯的「极多」而不取「亿」作下限，主档会失去数目依据。本条目按 0.1 取文本中数字的最小值，不作这一读法。"}]}]},{"type":"heading","level":2,"text":"七、横向比较"},{"type":"table","header":["对象","关键证据","与病人的关系"],"rows":[["三天帝（荒天帝、叶天帝、楚天帝，祭道之上圆满）","番外境界描述\\"都可随他们一念消散，眸光所致，枯竭所有，重现所有\\"；碰杯后一切\\"都在他们的眸光下瞬间恢复\\"","三人\\"难以将他完整的复活过来\\"，说明他的自我抹除强过三人的复活手段；这是特性上的比较，不传递破坏或掌控。点眉心时三人\\"波澜不惊\\"，按 1.4 只与三人自己的防御有关。病人问三人是否担心「活成和我一样的轨迹」，三人答\\"不担心\\"；原文没有给出双方战力的高下"],["十大诡异始祖","第一篇：荒天帝站在高原尽头，\\"目光所向，十大始祖崩碎，消失\\"","高原的十种原初物质出自他的病根，十大始祖盘踞在高原尽头（第一篇）；始祖与诡异一族是衍生物，按 0.14.2 的「归因对象」与 8.3.2 不算进本体。黑暗年代\\"诸世，数不清的大宇宙，都破碎了\\"同样不算在他名下"],["三重铜棺与石罐","《遮天》开篇的九龙拉棺；番外第二篇中九龙拉棺带叶凡一行\\"降落在荒古禁地中\\"；石罐由楚风在昆仑山下捡到","盛放他骨灰的容器。原文只说\\"以三重铜棺还有石罐承载其骨灰\\"，没有说是他所造；铜棺、石罐在后来持有者手中的表现按 8.3.2 分开评级，不算进本体"]]},{"type":"heading","level":2,"text":"存疑与作者矛盾"},{"type":"list","ordered":false,"items":[{"text":"**碰杯时的熄灭**：原文\\"一切都不复存在了，诸世彻底黑暗下去\\"，三天帝的身影随后\\"也重现\\"，说明熄灭连三人也一并吞没。但施动者没有写：可能是病人自己（四只杯子只有三只发出声音，三人刚说完\\"让那张旧照片彻底焚尽吧\\"），也可能是三人。若归于病人，范围是「一切」，这是全称描述，按判例只能确认「≥ 三部曲的整个世界观」〔下〕，原文没有给出可计数的数目，不改变档位。"},{"text":"**境界描述前后措辞不一**：番外写\\"亿万世界\\"\\"无量宇宙之外\\"，终章写\\"大千世界\\"\\"宇宙之外\\"，所指相同而写法不同。"},{"text":"**病因与机制**：祭道之上为什么会病，原文只有\\"内部而起，不是外部侵袭\\"和本人的自述，没有交代机制。按衡天 0.15，生来或本身如此的对象不需要交代来历，不影响定级。"}]},{"type":"heading","level":2,"text":"参考资料"},{"type":"list","ordered":false,"items":[{"text":"[起点中文网 · 《圣墟：番外》](https://m.qidian.com/book/1035677394/)"},{"text":"[起点中文网 · 《圣墟：番外》第三篇 楚天帝与病人](https://mkehuan.bookresource.qq.com/chapter/1035677394/743008617/)"},{"text":"[转载全文 · 圣墟番外 荒叶楚与病者](https://bbs.tatans.cn/topic/57654)"},{"text":"[起点中文网 · 《圣墟》](https://m.qidian.com/book/1004608738/)"},{"text":"[起点中文网 · 《遮天》](https://m.qidian.com/book/1735921/)"},{"text":"[起点中文网 · 《完美世界》](https://m.qidian.com/book/2952453/)"},{"text":"[微信读书 · 《圣墟》目录](https://weread.qq.com/web/reader/d9332d106dee962d93680a6k9fe328e036a29fe97fff9ac)"},{"text":"[网易 · 辰东重写《圣墟》结局（2021-03-30）](https://m.163.com/dy/article_cambrian/G6BT1KVH05520IYI.html)"},{"text":"项目原文：原文/圣墟_番外第三篇_楚天帝与病人.txt、原文/圣墟_番外第一二篇_荒天帝_叶天帝.txt、原文/圣墟_终章第二次大结局_截图摘录.txt"},{"text":"《衡天⊙多维战力量级体系（第五版）》《衡天工作守则与判例》"}]}]');function Ql({text:v}){const j=[],A=/(\*\*(.+?)\*\*)|(\[([^\]]+)\]\((https?:\/\/[^\s)]+)\))/g;let m=0,_,q=0;for(;_=A.exec(v);)_.index>m&&j.push(v.slice(m,_.index)),_[1]?j.push(f.jsx("strong",{children:f.jsx(Sf,{text:_[2]})},q++)):_[3]&&j.push(f.jsx("a",{href:_[5],target:"_blank",rel:"noopener noreferrer",children:f.jsx(Sf,{text:_[4]})},q++)),m=_.index+_[0].length;return m<v.length&&j.push(v.slice(m)),f.jsx(f.Fragment,{children:j.map((D,Y)=>typeof D=="string"?f.jsx(Sf,{text:D},"t"+Y):D)})}function go(v){let j=!0;return v.replace(/"/g,()=>{const A=j?"“":"”";return j=!j,A})}const So={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","ᵏ":"k",ⁿ:"n","⁺":"+","⁻":"−"},po={"₀":"0","₁":"1","₂":"2","₃":"3","₄":"4","₅":"5","₆":"6"
