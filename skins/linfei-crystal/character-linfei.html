precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform float uLight;   // 0 暗色 / 1 亮色
uniform float uFade;    // 主题切换过渡

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }

float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0,0.0));
  float c = hash(i + vec2(0.0,1.0)), d = hash(i + vec2(1.0,1.0));
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}

float fbm(vec2 p){
  float v = 0.0, amp = 0.5;
  mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
  for(int i = 0; i < 6; i++){
    v += amp * noise(p);
    p = rot * p * 2.03;
    amp *= 0.5;
  }
  return v;
}

// 星点
float stars(vec2 uv, float density, float t){
  vec2 g = floor(uv * density);
  vec2 f = fract(uv * density) - 0.5;
  float h = hash(g);
  if(h < 0.965) return 0.0;
  float tw = 0.45 + 0.55 * sin(t * 1.6 + h * 60.0);
  float d = length(f);
  return smoothstep(0.26, 0.0, d) * tw;
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes.xy;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes.xy) / min(uRes.x, uRes.y);
  float t = uTime * 0.035;

  // 流动的混沌云
  vec2 q = vec2(fbm(p * 1.6 + vec2(t, -t * 0.7)), fbm(p * 1.6 + vec2(4.4, 1.3) - t * 0.5));
  float f = fbm(p * 2.1 + q * 1.4 + vec2(0.0, t * 0.8));
  float f2 = fbm(p * 3.4 - q * 0.8 - vec2(t * 0.6, 0.0));

  float r = length(p);
  float core = exp(-r * 1.9);

  /* ---- 暗色：玄黑 / 幽紫 / 青 / 鎏金 ---- */
  vec3 dBg   = vec3(0.023, 0.027, 0.051);
  vec3 dVio  = vec3(0.26, 0.16, 0.48);
  vec3 dCyan = vec3(0.12, 0.44, 0.62);
  vec3 dGold = vec3(0.86, 0.68, 0.36);
  vec3 dark = dBg;
  dark = mix(dark, dVio, smoothstep(0.35, 1.0, f) * 0.72);
  dark = mix(dark, dCyan, smoothstep(0.45, 1.05, f2) * 0.4);
  dark += dGold * core * 0.16;
  dark += dGold * pow(smoothstep(0.62, 1.0, f * f2 * 2.3), 2.0) * 0.30;
  dark += vec3(0.9, 0.95, 1.0) * stars(uv * vec2(uRes.x / uRes.y, 1.0), 110.0, uTime) * 0.85;
  dark += vec3(0.95, 0.82, 0.55) * stars(uv * vec2(uRes.x / uRes.y, 1.0) + 7.3, 54.0, uTime * 0.7) * 0.6;
  dark *= 1.0 - 0.45 * smoothstep(0.45, 1.25, r);

  /* ---- 亮色：宣纸 / 淡墨 / 石青 / 赭金 ---- */
  vec3 lBg  = vec3(0.965, 0.941, 0.894);
  vec3 lInk = vec3(0.47, 0.45, 0.42);
  vec3 lBlue= vec3(0.49, 0.58, 0.64);
  vec3 lGold= vec3(0.74, 0.56, 0.24);
  vec3 light = lBg;
  light = mix(light, lInk, smoothstep(0.42, 1.0, f) * 0.30);
  light = mix(light, lBlue, smoothstep(0.52, 1.05, f2) * 0.22);
  light = mix(light, lGold, pow(smoothstep(0.66, 1.0, f * f2 * 2.3), 2.0) * 0.34);
  light += (1.0 - core) * 0.015;
  light -= 0.05 * smoothstep(0.55, 1.3, r);

  float m = clamp(uLight + uFade * 0.0, 0.0, 1.0);
  vec3 col = mix(dark, light, m);

  // 轻微颗粒，消除色带
  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.012;

  gl_FragColor = vec4(col, 1.0);
}

元宇宙的存在与覆灭，由我来定"（第1373章），林飞当场承认；这个多元宇宙由盘古把一个宇宙"切割为一万份，化为不同的位面"而来（第1330章）'},vm=[{k:"位格",v:'存在规模：巅峰期"自身体量已经足以与多元宇宙匹敌，体内有着无数大宇宙位面"（第1093章），按正文的多元宇宙规模计，约一万个宇宙位面〔实〕；层级轴：超脱（作品最高境界，结构标注，倍率〔缺〕）；番外 2 旁白"他早已凌驾于叙事层之上，视作者为泡影"，按衡天 7.8 记为特性，不计层数',accent:"violet"},{k:"可信度",v:"主档依据：番外 2 的创造（作者署名番外，结构由正文叙述与作者章内注释共同给出）；保底依据：正文终章旁白的能力定调（〔下〕）＋第1330章给出的位面数目"},{k:"破（破坏力）",v:'外·门（ℵ₀）〔推〕（由番外 2 的整体掌控推定，掌控式）；正文：全部多元宇宙 宇△〔下〕（旁白能力定调）；已展示：与叶道然一战"打崩了足足三个大宇宙位面"（第1123章），交战双方的余波，按衡天 0.15.1 记 宇○〔下〕',accent:"rose"},{k:"控（整体掌控）",v:'外·门（ℵ₀）〔实〕· 结构 φ(ω,0)（番外 2，创造并定下规则）；正文：全部多元宇宙 宇△〔下〕（"存在与覆灭""规则秩序"由其决定）；极道巅峰的境界定调"全力之下可完全支配一个宇宙"（第809章），林飞远在此上',accent:"gold"},{k:"域（影响）",v:'规则：一念创造第三个天道，"林飞掌握着它的绝对控制权"（第1376章），天道是"一切宇宙位面的秩序集合体"（第880章）· 影响范围：全部多元宇宙〔实〕；意志："生灵的想法和意志，由我来定"（第1373章旁白）· 已展示：令极道强者云天大帝当众跪爬（第1372章）；修复：隔空一抹，洪荒大陆天穹上全部位面投影星辰与太阴之月重现（第1373章），一个响指复原洪荒大陆、复活十年来战死的天庭成员（第1374章）· 可突破强度上限：极道强者〔实〕',accent:"cyan"},{k:"速（速度）",v:'跨位面瞬移〔实〕："在一念之下，便已降临仙界西海"（第1375章），倍数〔缺〕',accent:"jade"},{k:"性（特性）",v:'超脱〔实〕；全能宣称（"无吾不能之事，无我不胜之争"，记为宣称，不折算）；复活他人〔实〕；叙事层标签（番外 2，7.8）；长生（"活了万万年"）'},{k:"层级轴",v:"超脱 · 基准：作品中的多元宇宙 · 倍率：〔缺〕（文本没有给出超脱与内有多元之间的强度差）"},{k:"设定宣称",v:'番外 1：超脱后的洪荒大陆"仅仅是一个位面，却有着碾压无数多元宇宙的体量"；番外 2：燕问天对超脱的长篇描述（"一切塔，一切点，一切线……都属于其统治范畴的一部分"）；番外 4 的「超越数学」段落。都没有指明可计数的对象或给出结构，不进量级（第四节）'}],hm="御（防御）没有可换算的表现，未列出。",ym=[{k:"⊙",v:"综合量级标记"},{k:"外·门",v:"论外门槛：可数无限（ℵ₀），有限区间走完之后的第一级真正的无限"},{k:"结构 φ(ω,0)",v:"序数结构：嵌套的层级长度对应维布伦函数 φ(ω,0)，ε₀ 层的结构是它开头的一段；个数仍是 ℵ₀，在同为外·门的对象之间作为第二比较项"},{k:"宇△",v:"强宇宙级：可观测宇宙直径的 1～1 万倍，能量 8.0×10⁷⁷～8.0×10⁸⁵ J，按数量轴相当于 2 到 1 亿个标准宇宙"},{k:"宇○",v:"标准宇宙级：完全摧毁可观测宇宙（直径约 930 亿光年），8.0×10⁷⁷ J"},{k:"元·多",v:"一次作用波及多个完整宇宙"},{k:"掌控式",v:"主档来自整体掌控（同时支配一片范围内的全部物质与空间本身），破坏由此推定"},{k:"位格",v:"存在规模、计算层级、层级轴中证据过关的记录，与综合量级并列，互不推出（衡天 1.7）"},{k:"〔实〕",v:"已确认：文本直接展示了该表现"},{k:"〔下〕",v:"下限：只能确认至少如此"},{k:"〔推〕",v:"推定：由已确认的表现按允许的单步规则推出"},{k:"〔缺〕",v:"缺：文本没有可用的表现"}],gm=["林飞是长生万万年的修士，正文从都市开篇，逐步揭开洪荒、多元宇宙与两个纪元的历史，终局吞并天道与大道之力，证得超脱，成为多元宇宙的主宰。",'正文里的多元宇宙是有限的：第二纪元由盘古把一个宇宙切成一万份而来，每一份长成一个宇宙位面。正文终章旁白说超脱后"多元宇宙的存在与覆灭，由我来定"，所以只看正文，林飞的量级就是这一整个多元宇宙，落在强宇宙级（宇△）。',"番外 2 中，超脱后的林飞创造了一个层层嵌套、直到「无限阶」的宇宙晶体体系，结构完整、已经完成，作者注明其序型为 φ(ω,0)。林飞是这个结构的创造者和规则制定者，所以综合量级取到论外门槛，并标注结构 φ(ω,0)。"],pm=[{k:"阅读范围",v:"全书全文检索（「多元宇宙」「位面」「宇宙」「无限」「无数」「天道」「超脱」「内宇宙」「覆灭」等），精读终局第1311–1376章与大结局，以及检索命中的世界观章节；番外依据番外 1、2、4 的截图逐字阅读。"},{k:"世界观推定角色量级",v:"作品交代的世界规模，只要角色对这个世界整体做到了破坏、整体掌控或创造，世界的规模就是角色这一表现的规模（衡天 8.1 正例、0.11）。所以分两步：先确认世界有多大，再确认林飞与这个世界整体的关系。两步都成立就直接采用，不再另找证据。第二、五节分别对正文与番外 2 走这两步。"},{k:"正文与番外分开记",v:"番外是作者署名发表的后续，发生在超脱之后，按正式内容采用；主档取两者中较高的已确认表现，保底只用正文。"}],Rn={p1:'第1311章「苍天之怒」交代两个纪元：第一纪元的多元宇宙起于"一颗体积无穷小、质量无穷大的质点"，天道让质点炸开，"天道不得不将它们分化成一个个宇宙位面"；第二纪元"从上一纪元的废墟和灰烬之中诞生"，由盘古劈开混沌而成。',p2:"第1330章「盘古：老子上去就是一斧头」写明了第二纪元多元宇宙的生成：",quotes:["盘古施展万象更新，让这一元化的世界化为多元。","整个虚无死寂的宇宙被切割为一万份，化为不同的位面，开始呈现宇宙大爆炸似的疯涨，也就是一些科技文明观测得出的宇宙起源方式。","那三分之一笼罩在鸿蒙清气中的位面，便成为了后来的高等位面。","而盘古脚下所踏那片空间，便是后来的至高位面——洪荒大陆。"],p3:'后文与这个数目一致：第1340章「抵挡末日的脚步」，"可被入侵的低等位面却足足有三千个"；一万个位面中三分之一是高等位面，其余为低等位面，三千个是低等位面中被入侵的那一部分。'},xm=[{t:"地球所在的位面",d:'"能够观测到最遥远的星系，也和地球有着约132亿光年的距离"，至少是一个可观测宇宙',src:"第956章「天仙之怒」"},{t:"洪荒大陆",d:'"毕竟这座大陆就是一个宇宙的大小"',src:"第910章「洪荒见闻」，林飞语"},{t:"覆盖一个位面",d:'需要"跨越无数亿光年之远"',src:"第1087章「吃瓜群众欢乐多」"},{t:"位面之间有宇宙壁垒",d:'"一百五十亿年前宇宙壁垒还在诞生初期，脆弱得可怜"',src:"第808章「计都罗睺阵」"}],Sm="所以每个位面就是一个宇宙，以地球所在位面为基准，至少按标准宇宙（宇○）计。",qa={intro:'正文多处写「无限大宇宙位面」：极道强者"足以匹敌一整个无限大宇宙位面"（第957章），"仙帝的存在，便等若一个无限大宇宙位面的体量"（第1132章）。也有"多元宇宙茫茫无数位面"（第1071章旁白）。按衡天 8.1「明确设定陈述」审查：',rows:[{cond:"来源",state:"旁白",pass:!0},{cond:"指明对象",state:"「无限大」修饰的是单个位面的大小，「无数」修饰的是位面个数",pass:!0},{cond:"字面用法",state:'「无限大宇宙位面」几乎只出现在「体量匹敌」一类的境界描写里，是夸饰的固定说法；同一作品写位面有宇宙壁垒、覆盖一个位面要跨越"无数亿光年"、洪荒大陆可以按"五分之一"计算面积',pass:!1},{cond:"不被推翻",state:"第1330章给出了位面的明确数目「一万份」，每份从大爆炸式的疯涨中长成；第1340章的「三千个」与之吻合",pass:!1}],conclusion:"两条不过，「无限大」「无数」按衡天 0.2 处理为夸饰，正文的多元宇宙记为**约一万个宇宙位面**，有限，按宇△计。"},bm='作品的内宇宙境界按体内宇宙数目分级："内有一个宇宙、两个宇宙、三个宇宙，与内有无尽多元宇宙自然不是同等概念"（第739章「帝俊低头」，元始天尊语）。盘古终于"内有多元"，"混沌、鸿蒙、原暗疯狂涌出，化为一个个无限大宇宙"（第1328章「老子谈你妈」）；随后他把内宇宙几乎耗尽，"徒留最初的血色宇宙"，再把这一个宇宙切成一万份，就是第二纪元的多元宇宙（第1330章）。内宇宙的规模属于对象自身的体量（衡天 0.6），不是一次破坏或掌控的范围。',Us={head:"与叶道然的交手（正文）",intro:'第1123章「宋薇之死」：叶道然欲掳走林渊与宋薇，林飞"打破了对峙的局面，拿出不惜一决生死之势"：',quote:"两人这一战过于恐怖，打崩了足足三个大宇宙位面，甚至引得多元天道插手。"},jm=[{ch:"第1366章",name:"战大道三皇",tag:"终局一战",tone:"war",body:'林飞与大道三皇各取天道之力，"双方生生将整个天道给撕扯成了两半，而后直接捏碎"；林飞体内第二、第三个内宇宙相继成型。'},{ch:"第1367章",name:"该结束了",tag:"终局一战",tone:"war",body:'三皇"强行拔升了境界，进入了极其短暂的内有多元境界"；林飞"没有掌握完整的反规则符文，无法做到登临内有多元的层次。但……林飞有盘古斧"。交锋中，"漫天璀璨的繁星，皆在这一刻轰然爆碎炸裂开来"。'},{ch:"第1368章",name:"大患已除，生死难料",tag:"终局一战",tone:"war",body:'林飞与盘古拟态合一，"以当下最强且仅可动用一次的攻击，生生将那面盾牌劈开"；旁白说"林飞也好、大道三皇也罢，皆是将所有的力量凝聚于一处，不愿浪费丝毫"，洪荒大陆没有崩碎。'}],Cn={p1:'第1369章「十年神隐」，林飞以符文鼎炉炼化破碎的大道内宇宙，三皇料到他"甚至可能会踏出那一步……超脱"。第1373章「无吾不能之事」，林飞苏醒后让自杀的寰宇魔尊当场复生，寰宇魔尊颤声说出"超...脱？"，旁白随即写道：',verse:["超脱究竟意味着什么？","四个字而已。","无所不能。","多元宇宙的存在与覆灭，由我来定；","多元宇宙的规则秩序，由我来定；","生灵的想法和意志，由我来定。","无吾不能之事，无我不胜之争！"],p2:'林飞答"你倒还不算太蠢"，旁白说"如此话语，自然是承认了他的猜想"。',p3:'此后：隔空一抹，"光芒所过之处，一片片星域再度浮现，甚至连那颗太阴之月都重现天穹"，洪荒大陆的星辰是"多元宇宙各大位面的投影显化"（第982章）；一个响指复原洪荒大陆、复活战死者、令七族联军"化为劫灰"（第1374章）；最后"林飞甚至一念创造了第三个天道，稳固多元秩序规则。但这个天道并不公平。因为林飞掌握着它的绝对控制权"（第1376章）。'},Un={p1:'与陈夜论道之后，林飞"凭借全知全能的神通，打算以“层阶嵌套扩张”为核心的维度收纳之法，创造“宇宙晶体”"。他在洪荒大陆上空展开一片维度膜，"膜的一侧浮现出淡蓝色的“第一层宇宙”，另一侧则是深紫色的“第二层宇宙”——前者每向外延伸一微米，后者便随之暴涨出无法丈量的疆域"，并"为这片宇宙定下核心规则"：',rule:"存在一个两层的宇宙，第一层里每扩大一点都会令第二层扩大无限倍，宇宙的范围也可以看做是一个数字持续投入到第一层的扩大行为里，无限嵌套下去，把第一层内这个无限嵌套的整体压缩成一个宇宙晶体，然后第一层再继续扩张，又一次把整体投入第一层内部无限嵌套，再将这个无限嵌套的个体压缩成一个宇宙晶体，然后不断得到新的宇宙晶体，宇宙晶体的计数也可以将宇宙整体不断投入无限嵌套，这样的个体就是二阶宇宙晶体……以此类推，直到第一层宇宙内出现一个无限阶宇宙晶体。",p2:'随后"第一个晶体在嵌套结束时凝成"，"随后是第二个、第三个"，二阶、三阶晶体相继出现，"当那颗无限阶宇宙晶体出现时，它不再有具体的颜色，只像一个透明的锚点，将所有层级的嵌套与扩张稳稳收束"。陈夜随即造出一模一样的一对："这是两个同一层次、同一体量、同一量级、同一等级的造物，于此刻一同诞生在这虚空之中。"',p3:'作者在章内附「底层结构注释补充」，按其定义 ψ(0)=1、ψ(α+1)=ψ(α)×ω 逐步对应：第一层内一个宇宙晶体为 ψ(Ω)，二阶晶体为 ψ(Ω^2)，n 阶为 ψ(Ω^n)，"第一层宇宙内有一个无限阶宇宙晶体就是ψ(Ω^ω)"，并写明 ψ(Ω^ω)=φ(ω,0)。'},Ha={head:"番外 2：创造宇宙晶体体系。",items:[{k:"是否完成",v:'原文写到"无限阶宇宙晶体"已经出现，并"将所有层级的嵌套与扩张稳稳收束"，是完成态（衡天 0.17），不是「永远还有下一层」的过程；'},{k:"结构是否过门槛",v:"晶体可以逐一编号（第一个、第二个……一阶、二阶……），每一阶都由前一阶按写明的规则生成，没有最后一个，到「无限阶」收束为一个整体。这是衡天 8.1 第 3 条「完成态结构」的结构性证明，直接满足论外门槛；作者的序型注释与正文叙述一致，按 8.3 记结构 φ(ω,0)。φ(ω,0) 是可数序数：个数为 ℵ₀，层级长度为 φ(ω,0)，在同为外·门的对象中按这一结构比较（8.3）；"},{k:"是否是整体掌控",v:'整个体系由林飞从无到有造出，层间关系、压缩方式、阶数的生成都由他"定下核心规则"，"在林飞的设定下开始新的嵌套"。创造者决定了这片结构的范围与其中的一切，按衡天 0.11 记为整体掌控；'},{k:"来源",v:"作者署名的番外，叙述者为旁白，规则原文由作者在章内写出。"}],result:"记**控：外·门（ℵ₀）〔实〕· 结构 φ(ω,0)（创造）**。",mainText:'**正文：全部多元宇宙。** 第1373章旁白定调"多元宇宙的存在与覆灭，由我来定；多元宇宙的规则秩序，由我来定"，林飞当场承认。按衡天 0.14.1，旁白定调记为能力下限〔下〕；"存在"与"规则秩序"同时由其决定，覆盖范围本身与其中的一切，按 0.11 记整体掌控。规模按第二节：约一万个宇宙位面，记**控：宇△（元·多：约一万个宇宙位面）〔下〕**。',realmText:'**正文境界定调。** 第809章写极道巅峰"深入多元宇宙本质，从宏观来看，全力之下可完全支配一个宇宙"，林飞在正文终局远在极道之上；这一条只到宇○，已被上一条覆盖。'},Cs={items:[{k:"由掌控推定",v:"番外 2 的整体掌控按 0.11 推定 外·门（ℵ₀）〔推〕（掌控式）。原文没有写晶体中物质的状态，这一步推定以「宇宙」按作品惯例包含时空与物质为前提，风险写入存疑；"},{k:"正文能力下限",v:'"多元宇宙的存在与覆灭，由我来定"，旁白定调，宇△〔下〕；'},{k:"正文已展示",v:'与叶道然一战"打崩了足足三个大宇宙位面"。这是两人交战的余波，跨越整场战斗，原文没有拆分单次出手与各自的份额。按衡天 0.15.1 不把三个位面相加到一次出手上，只确认这场交手的余波至少崩碎了一个大宇宙位面，记宇○〔下〕；'},{k:"终局一斧",v:'力量"凝聚于一处"，没有可换算的波及范围；第1367章交锋中洪荒天穹的星辰爆碎，按第982章是位面的投影，但其后各大位面的强者照常登场（第1370章"诸多高等位面都乱成了一锅粥"），爆碎的是投影，不是位面本身，不计入破坏。'}],result:"**破坏力记录：外·门（ℵ₀）〔推〕（掌控式）；正文 宇△〔下〕（能力定调）；正文已展示 宇○〔下〕（交战余波）。**"},Ys={rows:[{ability:"天道",content:'一念创造第三个天道，掌握其绝对控制权；天道"维持着宇宙中的所有规则。小到你所知的化学物理规则，大到宏观时空秩序"（第880章）',range:"全部多元宇宙",cap:"未写明",ev:"〔实〕"},{ability:"意志",content:'"生灵的想法和意志，由我来定"；言出令极道强者云天大帝跪爬，"他就像是失控了一般"（第1372章）',range:"在场者；旁白定调为全部生灵",cap:"极道强者",ev:"〔实〕（展示）／〔下〕（定调）"},{ability:"修复与复活",content:'星辰投影与太阴之月重现，"甚至连一丝能量波动都未曾感知到"；洪荒大陆的战损复原，战死的天庭成员"哪怕形神俱灭，也在瑞彩中得以重生"',range:"洪荒大陆（一个宇宙大小）及其天穹上的全部位面投影",cap:"形神俱灭者",ev:"〔实〕"}],note:"按衡天 0.11、0.16，只改写规则、意志或事件走向的能力记入影响，不推出破坏。"},zm='正文终局"一念之下，便已降临仙界西海"（第1375章），跨位面瞬移，〔实〕，倍数〔缺〕。',Nm=[{t:"超脱",raw:'"空前绝后，两个纪元仅有的唯一超脱者！"（第1374章）',deal:"〔实〕"},{t:"全能宣称",raw:'"无吾不能之事，无我不胜之争！"；第1369章"没有任何规则能够束缚、没有力量上限、没有不可完成之事"（三皇视角的推想）',deal:"记为宣称；「没有上限」按衡天 0.17 不携带规模"},{t:"叙事层",raw:'番外 2 旁白："他早已凌驾于叙事层之上，视作者为泡影。——无限全知，无限全能！"',deal:"按衡天 7.8 只说明层级关系，不说明强度，记为标签"},{t:"复活他人",raw:"第1373、1374章",deal:"〔实〕"}],Em=[{k:"存在规模",v:'第1093章「水云宫」，"那时的林飞，自身体量已经足以与多元宇宙匹敌，体内有着无数大宇宙位面"。按正文多元宇宙的规模，约一万个宇宙位面〔实〕。这是体量，按衡天 0.6 不折算为破坏。'},{k:"层级轴",v:"超脱为作品最高境界，高于内有多元；作品没有给出两者间的强度倍数，按衡天 7.9 只记结构标注。"},{k:"计算层级",v:"「全知」只有宣称，没有计算表现，〔缺〕。"}],_t={mainIntro:"按衡天 1.3，主档取破坏、整体掌控两维中证据为〔实〕或〔下〕的最高者：",mainItems:["控：外·门（ℵ₀）〔实〕· 结构 φ(ω,0)（番外 2，创造）；","控、破：宇△〔下〕（正文，旁白能力定调）；","破：外·门（ℵ₀）〔推〕（由番外 2 推定）。"],mainResult:"**综合量级为 ⊙外·门（ℵ₀）〔实〕· 结构 φ(ω,0)（掌控式·创造）。**",floor:"主档推理链中争议最大的一步，是采用番外 2：番外发表在正文完结之后，结构由作者在章内用序数注释给出。去掉这一步，只看正文，旁白定调的「多元宇宙的存在与覆灭」仍然成立，规模为约一万个宇宙位面。**保底量级为 ⊙宇△（元·多：约一万个宇宙位面）〔下〕。**",twoSteps:[{k:"正文",v:"世界规模是第1330章的「一万份」，有明确数目；林飞与这个世界整体的关系是旁白定调的「存在与覆灭由我来定」与一念创造天道。两步都成立，林飞的正文量级就是这个多元宇宙的规模——宇△。正文的「无限大宇宙位面」「无数位面」没有通过 8.1（第二节），所以正文世界本身不是无限的，不能由此推到论外。"},{k:"番外 2",v:"世界规模是林飞自己造出的、到「无限阶」收束的嵌套结构，通过 8.1 第 3 条；林飞与它的关系是创造并定下全部规则。两步都成立，所以量级取到这一结构：外·门，结构 φ(ω,0)。"},{k:"番外 1",v:'超脱后的洪荒大陆"有着碾压无数多元宇宙的体量"，燕问天手中弹珠的空间"大小，已是无限的无限次方"，其后每一层是前一层的前一层次方，"以此类推，无休无止，无限叠加"。前者是体量与「无数」，没有可计数的对象；后者若按序数读，从 ω^ω 起按 α→α^α 迭代，上确界为 ε₀，低于番外 2 的 φ(ω,0)。现有截图没有交代弹珠由谁造出、与林飞是什么关系，第二步〔缺〕，不进主档。「永不停息，随着天尊的境界提升，不断升华」说明仍在增长；按衡天 5.6 的完成态检验，增长本身不否定已达到的部分，只是按已达到的部分记录（0.17）。'}],whyNotHigher:["番外 2 的「无限阶」是一个可数序数结构，「无限倍」「无法丈量」都在这个结构之内，不改变基数（8.3.3：用盒内的操作突破不了盒子）。",'燕问天对超脱的描述"一切塔，一切点，一切线，一切链，一切永恒，一切设定……都属于其统治范畴的一部分"，是罗列式的全称宣称，没有指明对象与结构，按衡天 8.1、8.4 不过门槛；"视作者为泡影"按 7.8 只记标签。',"番外 4「补丁修正」通篇是「超越数学」「无数更高x能」「不动点不动点……的嵌套」一类的递进措辞，没有写出任何一层是什么、怎样生成，按衡天 7.6 最后一行与 0.2 处理为修饰，不进量级。"],versus:'按衡天 1.7.3，默认比较综合量级。番外 2 中陈夜造出"同一层次、同一体量、同一量级、同一等级"的晶体，两人在这一表现上相当。正文中的全能宣称（"无我不胜之争"）是规则型宣称，只在本作内部成立，跨作品比较不据此判胜负。'},Tm=[{name:"陈夜（道尊）",evidence:'番外 2 造出完全相同的一对晶体；"二人境界层面相同"',relation:"≈，依据番外 2",sym:"≈"},{name:"大道三皇",evidence:'覆灭第一纪元（"全多元生灵俱灭"，第1328章）；终局短暂进入内有多元',relation:'林飞 ＞ 三皇：第1368章正面劈开三皇的防御，"直入三皇元神"；此后三皇被锁死、自裁',sym:"＞"},{name:"叶道然（六道魔尊）",evidence:'与林飞交战"打崩了足足三个大宇宙位面"；最终一战选择"坦然赴死"',relation:'林飞 ＞ 叶道然：旁白"一次败于林飞是意外，那两次就是技不如人"（第1368章）',sym:"＞"},{name:"盘古",evidence:"内有多元；斧劈大道三皇，开辟第二纪元，切出一万个位面",relation:'超脱高于内有多元；林飞终局一斧借盘古拟态完成，超脱之后为"两个纪元仅有的唯一超脱者"（众人议论）。只记境界高低，不以盘古的战绩抬高林飞的已确认表现（衡天 0.20 第三类）',sym:"＞"},{name:"极道强者（仙帝）",evidence:'"全力之下可完全支配一个宇宙"（极道巅峰）',relation:'超脱后一句话令云天大帝当众跪爬（第1372章），眸光一转，其余六尊极道强者"如下饺子般从空中跌落"（第1373章），远高于此',sym:"≫"}],Am=[{t:"林飞过去的境界",v:'第739章元始天尊说林飞有"内有多元宇宙之境"，第1093章说"那时的林飞……体内有着无数大宇宙位面"；第1367章又写林飞"无法做到登临内有多元的层次"。前两处指林飞过去的巅峰，后一处指终局当时的状态；作品没有交代其间的跌落经过，本条目以终局为准，过去的巅峰只记入存在规模。'},{t:"「无限大宇宙位面」与「无数
