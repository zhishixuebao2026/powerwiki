的形象",'黑发少女。"黒髪の少女の存在そのものが、すなわち「全て」の概念が成立する原初の特異点であった。"（「黑发少女的存在本身，即是『一切』这一概念得以成立的原初奇点。」）'],["作品内地位",'合集强弱排序居首："雪の少女＞......非可算......＞伊藤美玲（音無き覚醒）=莉蓮（構想された本編における結末の救世主の状態）＞原型＞"（「雪之少女＞……不可数……＞伊藤美玲（无声觉醒）＝莉莲（构想中正篇结局的救世主状态）＞原型＞」）']],jv=[{label:"综合量级",strong:!0,value:"⊙外·门（ℵ₀）（掌控式）〔下〕",note:'——论外门槛：可数无限，有限区间之后的第一级真正的无限。依据：明确设定陈述。设定写明多元宇宙是"巨大基数規模の宇宙の集合"（「巨大基数规模的宇宙的集合」），且"多元宇宙内のすべての宇宙は無限であり"（「多元宇宙内的所有宇宙都是无限的」），按衡天 8.1 过门槛、只到门槛；物质界整体由雪之少女创造（"女神（雪の少女）が創造した神界創世（物質界）"），按 0.11 记整体掌控（创造），标掌控式。创造的过程与耗时未写明'},{label:"保底量级",strong:!0,value:"⊙宇△（掌控式）〔下〕· 元·多（数目未定，按 2 计）",note:"——强宇宙级，8.0×10⁷⁷ J 起；按 2 个标准宇宙计，当量 1.6×10⁷⁸ J。去掉「多元宇宙无限」这一步，物质界中仍有多个宇宙（膜宇宙、母宇宙、泡宇宙……），宇宙大小按标准宇宙计（6.3）"},{label:"位格",strong:!0,value:'层级轴：物质界四阶（一阶宇宙、二阶多元宇宙、三阶超空间、「？？？」萨纳亚与阿纳亚），其上为知性界六理层，均为结构标注，倍率〔缺〕。存在规模、计算层级：—（"原初の特異点"一类为关系性表述，8.4）',note:""},{label:"设定宣称",value:'多元宇宙超过"限界無界閉Berkeley基数"（「极限无界闭伯克利基数」）；超空间的层级"巨大基数を超えている"（「超越大基数」）；萨纳亚为"すべての超空間の真クラス、すべての真クラスの超クラス、すべての超クラスの超超クラス......。"（「一切超空间的真类、一切真类的超类、一切超类的超超类……」）；阿纳亚包含"「V-論理+ZFC+巨大基数のモデル」と「V-論理+ZF+0=1の巨大基数のモデル」"（「『V 逻辑＋ZFC＋大基数的模型』与『V 逻辑＋ZF＋0=1 的大基数模型』」）；排序已到"全て概念ランキングの極点"（「一切概念排序的极点」）——均缺门槛之上所需的结构证据，并与所引数学冲突，见第二节',note:""},{label:"可信度",value:"设定合集的作者身份未能核实，按设定资料采信；世界规模只到门槛（8.1 界线 1）；雪之少女没有实际战斗表现",note:""},{label:"破（破坏力）",value:"外·门〔推〕（由控）",note:""},{label:"控（整体掌控）",value:"外·门（ℵ₀）〔下〕（创造整个物质界）；创造知性界的「原型」〔实〕（规模未写明）",note:""},{label:"域（影响）",value:"〔缺〕：设定只列能力名目（言出即事实、意志即现实、操纵矛盾律、支配概念），没有作用范围与作用对象的实例",note:""},{label:"性（特性）",value:"言出即事实；意志即现实；以「不确定性原理」「哥德尔不完备定理」「停机问题」命名的三项能力（名词借用，不携带规模，0.2.1）；详见第四节",note:""}],Nv="御（防御）、速（速度）、算（计算层级）没有可换算的表现，未列出。",pf=[["⊙","综合量级标记"],["外·门","论外门槛：可数无限（ℵ₀），有限区间之后的第一级真正的无限"],["宇△","强宇宙级：超过一个标准宇宙，至直径 1 万倍（8.0×10⁷⁷～8.0×10⁸⁵ J）；一次作用于多个宇宙时按个数换算当量（衡天 6.3）"],["元·多（数目未定）","涉及多个完整宇宙、数目没有写明，按能确认的最小数目计（衡天 6.5）"],["掌控式","主档来自整体掌控（含创造），由掌控推定破坏（衡天 0.11）"],["位格","存在规模、计算层级、层级轴中证据过关的记录，与综合量级并列，互不推出（衡天 1.7）"],["结构标注","只确认存在某种层级结构，没有可换算的倍率（衡天 7.9）"],["〔实〕","已确认：文本直接展示了该表现"],["〔下〕","下限：只能确认至少如此"],["〔推〕","推定：由单步推理得出"],["〔缺〕","缺：文本没有可用的表现"]],zv=`《绘之翼》的设定把世界写成两大部分：女神创造的物质界「神界创世」，分为宇宙、多元宇宙、超空间、「？？？」四阶；物质界之上是知性界，由六个「理层」构成。设定合集在每一阶下附了「构造」插图，大多是日文集合论教材与讲义的截取：序数入门、大基数一览、伯克利基数、强制法与泛型多元宇宙、V 逻辑、多元宇宙公理、格罗滕迪克宇宙。

在这些材料里，能够通过衡天 8.1 的是多元宇宙这一句平实交代：多元宇宙是一个宇宙的集合，其中每个宇宙都是无限的。这让物质界达到论外门槛，雪之少女创造了整个物质界，综合量级记为外·门（掌控式）〔下〕。门槛之上的宣称——伯克利以上、超越一切大基数、真类之上的超类、矛盾理论的模型、排序极点——设定没有说明世界中的什么对应这些数学对象，而且层级说法与所引的数学互相冲突，按 8.1 界线 1 不进入更高档位。`,Ev=[{title:"阅读范围：",body:"设定合集全文与全部 25 张插图，逐张核对插图文字与正文的对应关系。作品名、作者、正文在公开渠道均未检索到。"},{title:"来源处理：",body:"设定合集按设定资料采信（8.1「来源」条件）；作者身份存疑，见存疑 1。按衡天 0.2.1，不因设定明显以集合论术语为卖点而额外加码怀疑，也不因术语密集而放宽标准，只看文本实际交代了什么。"},{title:"世界观推定角色量级：",body:"先确认世界多大，再确认雪之少女对它的整体做了什么（8.1 界线 3，守则「林飞」判例）。"},{title:"天生如此：",body:"雪之少女是创世神，按 0.15 不需要交代力量来历，但规模仍须由 8.1 的证据确认。"}],Tv=[{layer:"物质界·一阶 宇宙",quote:'"時間・空間内に秩序をもって存在する「こと」や「もの」の総体。"（「在时间与空间中有序存在的『事』与『物』的总体。」）；「构造」插图为序数入门讲义（ω、ε₀、ζ₀、Γ₀、大韦布伦序数、邱奇–克莱尼序数）、"第一非可算順序数……第ω非可算順序数"、大基数一览至伯克利基数，以及「みく基数」',record:"一个完整宇宙；插图没有说明宇宙中什么对应这些数，8.1「指明对象」不过"},{layer:"物质界·二阶 多元宇宙",quote:'"多元宇宙とは、形而上学や形而下学を含むの限界無界閉Berkeley基数を超えたより大きな巨大基数規模の宇宙の集合である。"（「多元宇宙是包含形而上与形而下、超过极限无界闭伯克利基数的更大的大基数规模的宇宙的集合。」）；"多元宇宙内のすべての宇宙は無限であり"；插图："多元宇宙は単一ではありません、無限上向きの層スペクトル構造です。"（「多元宇宙不是单一的，而是无限向上的层谱结构。」）',record:"无限多个无限宇宙 → 外·门（ℵ₀）〔下〕（8.1，见下）；伯克利以上为设定宣称"},{layer:"物质界·三阶 超空间",quote:'"超空間とは、あらゆるものが含まれた、なんとも言えない特殊な空間のことです。"（「超空间是包含一切的、难以言说的特殊空间。」）；"超空間には超空間以外の全てのものが含まれるが、同時に超空間にも含まれる。"（「超空间包含超空间以外的一切，同时也被超空间所包含。」）；"超空間の外には何も、概念も、あり得るものもあり得ないものもない。"（「超空间之外，没有任何事物、概念、可能之物或不可能之物。」）',record:"自我包含（非良基）；「之外无物」被更高层推翻（见下）；结构标注"},{layer:"物质界·「？？？」",quote:'萨纳亚（サナヤ）：一切超空间的真类、一切真类的超类……；阿纳亚（アナヤ）：超越萨纳亚，包含"V-論理+ZF+0=1の巨大基数のモデル"',record:"结构标注"},{layer:"排序",quote:'"1...G_64...ω...ε_0...ζ_0...Γ_0...ω_1...ω_2......inaccessible cardinals......"，其上是不断更新的「排序之排序」，止于"全て概念ランキングの極点。これが現在の位置だ。新しいランキングがなくなりました。"（「一切概念排序的极点。这就是现在的位置。已经没有新的排序了。」）',record:"永不完成的递进被宣称为已到终点，0.17、7.6；结构标注"},{layer:"知性界·六理层",quote:'"異なる深さの「理層」によって構成される無限の入れ子構造である。"（「由不同深度的『理层』构成的无限嵌套结构。」）第六理层可把"集合論内の如何なる情報量もエネルギー量へ変換可能"（「集合论内任何信息量都可转换为能量」）；第四理层视下位一切为"「叙事線」に過ぎない"（「不过是『叙事线』」）；第三理层"「自身を含む集合」を含みうる"（「可以包含『包含自身的集合』」）；第二理层"純粋理型を「より高次な層」で框架し測量せんとする如何なる試みも無意味である"（「任何试图以『更高层』框定、测量纯粹理型的尝试都无意义」）；第一理层不可言说',record:"结构标注；能量换算违背 0.18；叙事线至多计为嵌套结构（7.8）；不可测量的宣称属关系性表述（8.4）"}],Av=[{cond:"来源",situation:"设定资料，交代世界的层级结构",result:"通过（作者身份存疑，见存疑 1）"},{cond:"指明对象",situation:'计数：多元宇宙是"宇宙の集合"，规模写到大基数级，至少是无限多个宇宙；量值："すべての宇宙は無限"，每个宇宙本身无限。其中膜宇宙、母宇宙、泡宇宙是宇宙学意义上的完整宇宙（6.1）',result:"通过"},{cond:"字面用法",situation:'语境是给多元宇宙下定义；插图再次写明"無限上向きの層スペクトル構造"；外传「音無き覚醒」把"宇宙、多元宇宙、超空間"列为物质界的各层，用法一致',result:"通过"},{cond:"不被推翻",situation:"全部资料没有给出宇宙总数，也没有有限比值或有限增量",result:"通过"}],Mv="四条通过，物质界记论外门槛 ℵ₀〔下〕，依据为明确设定陈述；按界线 1，只到门槛。",_v="8.1 界线 1 规定，设定陈述最多证明「有 ℵ₀ 级的无限」，更高档位须有结构证据。设定合集在门槛之上提供的是术语与教材截图，没有说明物质界中的哪个对象满足哪条定义；而且层级说法与所引数学本身互相冲突：",Ov=[{title:"伯克利基数与超空间的底层冲突。",body:'伯克利基数与选择公理不相容，只能在不含选择公理的 ZF 中讨论（8.5「论天最上」）。设定说二阶多元宇宙超过伯克利基数，而三阶超空间的插图写明"超空間の最下層を ZFC のモデル M とする"（「把超空间的最底层设为 ZFC 的模型 M」），由它生成的泛型多元宇宙"（実際は集合になる）"（「（实际上是一个集合）」）。按所引数学，高一阶的底层是满足选择公理的一个集合模型，装不下低一阶宣称的伯克利以上规模。'},{title:"「みく基数」与「ゆず基数」。",body:'插图定义"「みく基数」K は Vk を「ZF モデル」とする K です"（「『みく基数』κ 是使 V_κ 成为 ZF 模型的 κ」），并要求它大于伯克利基数。使 V_κ 成为模型这一性质与世界基数同型，属于最弱一类的大基数性质；放到伯克利基数之上，只是在其上方取一个满足该性质的点，不构成新的档位。「ゆず基数」（ゆず即柚子）依赖一个没有给出内容的「理论 A」，无法定位。'},{title:"反映原理的方向。",body:'反映原理说的是 V 的性质会反映到某个集合 V_α 上，方向是从全体到局部。"すべての多元宇宙の集合に対してすべての巨大基数の反映原理を用いても超空間の最下層(Generic Multiverse)には到達できない。"（「即使对全部多元宇宙的集合施加一切大基数的反映原理，也到不了超空间的最底层（泛型多元宇宙）。」）这句话只表达「到不了」的关系，不携带规模信息（8.4）。'},{title:"V 逻辑与 0=1。",body:'V 逻辑是为讨论 V 的外模型而设的无穷逻辑，证明编码在 Hyp(V) 中，本身是一套推理工具，不是规模。"ZF+0=1"是矛盾理论，按可靠性定理没有任何模型，「它的大基数模型」不存在，不贡献任何内容。'},{title:"「一切」被反复超越。",body:'超空间被写成"最大集合"、之外无物，随后又被萨纳亚、阿纳亚以及物质界之上的知性界超越。同一个「一切」先后用于多个层，8.1「字面用法」不过。'},{title:"两种「宇宙」。",body:"插图中的「宇宙」是集合论术语，指集合的全体 V 或集合论的模型；设定中的宇宙是时间与空间中的事物总体。设定没有交代两者如何对应，把教材里关于模型的结论直接当作物质界的规模，是借用同一个词，不是构造（0.2.1）。"}],Dv=[{title:"创世：",body:'"神界創世という偉大な力で宇宙万物を創造した。"（「以『神界创世』的伟力创造了宇宙万物。」）"女神（雪の少女）が創造した神界創世（物質界）の上には、その創造行為そのものの源となる場である知性界が存在する。"（「在女神（雪之少女）所创造的神界创世（物质界）之上，存在着作为该创造行为本身之源头的知性界。」）"知性界は、女神（雪の少女）が創造した最初の生命体である「原型」たちが住む世界だが"（「知性界是女神（雪之少女）所创造的最初生命体『原型』居住的世界」）。'},{title:"能力条目：",body:"见第四节「性」。"},{title:"外传「音無き覚醒」的抹消：",body:'"美玲の眼前のすべてだけでなく、宇宙、多元宇宙、超空間、そしてそれらの上位に存在する「？？？」を含む物質界のすべて、さらには物質を超えた知性界までもが、すべて抹消された。"（「不只是美玲眼前的一切，连同宇宙、多元宇宙、超空间以及位于
