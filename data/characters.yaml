    《西游记》百回本主角。本条目**只评原著文本**（语料：`sources/西游记/`，引文均逐字核对），不含影视、游戏与后世评书。完整审理见仓库文件《西游记孙悟空战力量级分析.md》，原文摘录见《西游记孙悟空原文材料包.md》，卡片格式见《量级分析补充提示词·综合战力卡.md》。站内「量级」只是攻击能量档，不是综合战力——上面这张卡才是完整画像。

