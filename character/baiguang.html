 way out of Cimön except into the Absolute"。从 Mainside 的沙漠朝「零」走，和从 Flipside 的山朝「无限」爬，到的是同一处："Zero and Infinity. They’re the same at the Absolute."。两层之间的强弱书里没写，倍率〔缺〕。',children:[]},{text:"**计算层级：〔缺〕。**",children:[]}],Jm=["人可以化为白光、与它合一，然后在别处重新成形；",'合一时没有任何分别，"the word and I and the Absolute were all identical"；',"它的任何描述也适用于某个有限、相对的东西：叙述者用反射原理解释，为什么合一之后总是落回某一层。"],Wm=['绝对无限，"bigger than any conceivable level"；','"The Absolute is Everything, but it’s Nothing, too."；',"零与无限在它那里相同，「是」与「否」相同。"],km="**可信度**：中偏低。世界结构来自叙述者亲历和两位知情人物（康托尔、弗兰克斯），写得扎实；综合量级则靠一段昏迷中的见闻加一环推定，比结构证据弱得多。",$m=[{label:"控（整体掌控）",text:"外·三 起〔推〕（掌控式）（推定链 1 环）：一切都靠井下之物运转，见第四节"},{label:"破（破坏）",text:"〔缺〕"},{label:"域（影响）",text:"〔缺〕。叙述者说必须先到白光才能回到地球的身体，书里没写这是白光的作为还是到达本身的结果"},{label:"御、速",text:"〔缺〕"},{label:"性（特性）",text:"可被融入；融入者重新成形；反射到有限之物"}],Sf=[{label:"起〔推〕",text:"从这一档起，属于推定：由原文出发经写明的推定链得出，链有几环就写几环"},{label:"位格",text:"存在规模、层级、计算层级里证据过关的部分；与综合量级并列，互不推出"},{label:"外·门",text:"论外门槛：可数无限（ℵ₀），能一个个编号、没有最后一个"},{label:"外·三",text:"论外三线：连续统 2^ℵ₀，一个可数无限集合的全体子集那么多"},{label:"外·二",text:"论外二线：在连续统上再取全体子集（ℶ₂）及以上"},{label:"天·下",text:"论天下：不可达基数一类，要写出「从下面取全体子集、取并都够不到」的封闭性质才算"},{label:"字面档位",text:"书里点了名、没有写出该档定义特征的档位，只记在旁边"},{label:"掌控式",text:"对一个整体连同其中的一切接管或维持"},{label:"〔下〕〔缺〕",text:"下限（至少如此）；没有可用的数据"},{label:"保底量级：无",text:"去掉推定链上争议最大的一环后，没有剩下可用的证据"}],Fm='**普通宇宙是无限的。** 爱因斯坦在 Cimön 解释说，那里拥挤是 "because we come from a universe with infinitely many inhabited star systems"，而 "Cimön is right next to every point in the ordinary Universe"。',Im='**Cimön 的形状。** 弗兰克斯的交代最完整："Think of Cimön as an infinite strip of canvas with a painting on each side."。两面的内容如下：',Pm=['**Flipside**：顶上是 On 山，"A shrinking field fits the whole Absolute Infinity in."。','**Mainside**：最上面是沙漠；沙漠下面是一条无尽的垃圾带；再下面是平原上的城市，"One for each world and for each era"。','**夹层**：梦境区。康托尔说梦境不是做梦的人造的，"the visions will still be there when every dreamer is gone. Like with sets, is it not?"。'],lv='**On 山的层次。** 第六章耶稣对费利克斯说："It’s infinite, Absolutely Infinite, but you’ll find a way to the end."。康托尔在希尔伯特旅馆说："This is only the beginning of the second number class. Beyond lie all the alefs. And beyond that is the Absolute"。',tv=[{level:"ℵ₀（外·门）",source:'希尔伯特旅馆只有两百英尺高，却 "had infinitely many floors"，每层只用剩余高度的二十分之一；客满时人人挪一间，空出一号房；On 山第一段悬崖一道接一道，"we zapped past our first alef-null cliffs"',result:"写出了结构"},{level:"ε₀",source:'加速之上再叠加速，弗兰克斯说是 "raising alef-null to the alef-null power alef-null times in a row"',result:"写出了结构；仍是可数的"},{level:"ℵ₁",source:'费利克斯："Alef-one can’t be reached by any countable process."；ℵ₁ 那段悬崖 "was perfectly well-ordered. Above every cliff or set of cliffs there was always a unique next cliff."',result:"写出了 ℵ₁ 的特征：不可数、良序、任何可数过程都到不了"},{level:"连续统（外·三）",source:'叶子十叉分枝，一只虫一路往上选，"A whole continuum of possible paths—c of them."；费利克斯写出的书 "There were c of them"，每页一种可能人生；梦境区有连续统那么多的可能景象',result:"写出了结构：无穷次选择的每一种完整组合各是一页，全部同时存在"},{level:"ℵ₂、ℵ_{ℵ₀}、不可达基数",source:'弗兰克斯：沙漠里有 "tunnels to alef-two, to alef-alef-null, to the inaccessible cardinals—I’ve seen them"；康托尔推测若有第三种基本物质，连续统至少是 ℵ₂',result:"只有名字。没写这些层是什么样子，也没写不可达的封闭性质"},{level:"绝对无限",source:'On 山的高度；"bigger than any conceivable level"',result:"设定宣称"}],ev='书对 ℵ₁ 和连续统的区分很小心。c 页的书没有第一页、没有下一页，ℵ₁ 道悬崖却是良序的，"there was no obvious way to compare them"，两者谁大书里留作连续统问题。所以这里的外·三只靠书页和梦境，不靠 ℵ₁ 的悬崖。',av='**身份。** 小写的白光是人化掉身体、在别处重新成形时的样子；康托尔离开时 "turned into a ball of white light"，爱因斯坦也是在一道白光里消失的。大写的白光是人在那一刻融入的太一。弗兰克斯说 "I became the White Light"，"I saw the One"；城里的人说 "Once you’re all white you’re the same as their God. But you always come back somewhere."。',uv=['费利克斯出发前问过它连续统问题，得到的是一种感觉："Relax, you’re not ready"。','融入的人都会落回某处。弗兰克斯见到太一后 "I landed at alef-one"；费利克斯在沙漠尽头缩到只剩「一」，醒来回到了地球，他说 "I had to get to the White Light before I could come back"。','叙述者用反射原理解释前一条："Any description of the Absolute also applies to some limited, relative thing."，"The Absolute divides, tries to get outside itself, and wham, there’s a beetle looking at alef-one."。这说的是全体与局部的关系，不是它对某个世界做的事。'],nv="正文明写的就是这些。维持一切的那段在结尾，见第四节。",iv="**为什么是连续统起、掌控式，并且记〔推〕。** 按「超越者按其所超越的结构定档」，要两步都成立：",cv=["**第一步成立。** 白光之下的结构写到了连续统。","**第二步靠推定成立。** 结尾的见闻写出「一切东西都靠井下之物运转」，包括我们的宇宙和 Cimön，这是对整体的维持。井下之物是白光，是推定的一环。"],fv=['**井下是什么，书里刻意没写。** 全书最后一句是 "She never bothered to ask me what had been in the manhole."。认作白光是读者从上下文作出的一步推断。','**见闻发生在昏迷中。** 他说当时 "I thought I was dead"。书里他的出窍经历都是真的，这一段按同样的方式采信；但这是全书唯一一处，没有旁证。'],sv='**仍不采信的材料：第二部题记。** 题记引的是康托尔本人的话："The actual infinite in its highest form has created and sustains us"。它和结尾见闻的意思一致，但题记是作者引来的真实人物原话，不是作品世界里的叙述，所以只说明作者的意图，不作为证据。',dv=["**连续统以上只有名单。** 不可达基数那句出自弗兰克斯，没写那一层的性质，后文也没有人去过那些隧道。","**反射原理不构造更高的层。** 它说的是由全体到局部的关系，书里用它解释为什么落回 ℵ₁。",'**第四部的物理也没超过连续统。** 普通物质由可数个单子组成，以太由 ℵ₁ 个，空间有连续统个点（"Ordinary mass-objects only have alef-null points, but aether objects have alef-one"）。最后一章费利克斯说 "There would be a third level of substance, too. Endlessly many. The number of points in space is Absolutely Infinite"，这是他想继续做实验去验证的设想，书里没有证实。'],ov=["到连续统为止，每一层都写出了定义特征，ℵ₁ 和连续统还分得很清楚；","梦境区的连续统写出了留存：做梦的人都不在了，景象仍在；","把白光的存在规模记成全体，依据是融入过它的人的直接说法，只用了一步。"],rv=[{label:"费利克斯（Cimön 中）",source:'数到 ℵ₀；把 π 的无穷级数加完，开了一把以 π 为密码的锁；化白后写出 c 页的书；他说看完全部页数需要 "that white-light ability to handle the uncountable infinities"',result:"计算层级 0′〔实〕：在有限时间里完成可数无限步，并得到结果；处理不可数无限是他对白光状态的说法，记特性"},{label:"费利克斯（回到地球后）",source:"把一团超物质球按巴拿赫–塔斯基分解复制成两个",result:"特性，未定级"},{label:"弗兰克斯",source:"爬到 ℵ₁；融入太一后落回 ℵ₁；说在沙漠隧道见过更高层",result:"层级位置 ℵ₁；更高层只有自述"},{label:"康托尔、爱因斯坦、希尔伯特",source:"在 Cimön 讲解世界；化为白光球来去",result:"无表现，未定级"}],hv=["**书页和景象算不算完整的结构。** 外·三数的是对可能人生的描述和梦境里的景象，不是一个个宇宙。若不认，存在规模退到外·门：希尔伯特旅馆、无限多有人居住的星系、每个世界各一座城。",'**「白光就是全体」的来源。** 依据是弗兰克斯的话。他融入过白光，但说这话时情绪很不稳定，下一句又说 "it’s Nothing, too"。',"**不可达基数那一句。** 只有弗兰克斯一个人说，没有旁证。","**昏迷见闻。** 如果把它当作昏迷中的幻觉，或者不认井下之物是白光，综合量级退回未定级。题记无论如何不作为证据。",'**作者序言。** 鲁克在序言里说他至今相信 "God—or the Absolute, or the Big Aha—is a blinding white light which it is possible for a human to directly perceive"。这只用来确认白光、绝对、上帝是同一对象，不作为设定陈述。',"**未逐段读的部分。** 第三部、第四部只按关键词读，可能有遗漏。"],mv="《白光》（White Light），鲁迪·鲁克著，Transreal Books 2016 年版；作者网站在线版：",Cr="https://ww
